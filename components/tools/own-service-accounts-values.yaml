# ADR 0031: tool servers that cannot read the Secrets of the tools namespace.
# The chart writes a ServiceAccount, a Role with no right on Secrets and a RoleBinding for every tool server in mcp.namespace, and names the account in the
# tool server's spec, so the tool group operator makes none. The header credentials of mcp.endpoints still reach the tool server pods as environment values
# from Secret references; the pod never reads a Secret through the API.
# It is a platform switch. Put this file in the VALUES_FILE list of the full demo ONCE, and keep it in the list of every run of every installer (the use case
# installers with --beside-full-demo and ALSO_COMPOSE included): Helm replaces the release values on every run, and install.sh refuses to turn the switch from
# true to false on a live release (ALLOW_TOOL_SECRET_READ=1 overrides). Turning it on restarts every tool server once: do it between runs.
mcp:
  virtual:
    ownServiceAccounts: true
