# Minimal single-pod PostgreSQL (with pgvector) for kagent. Spike-only: password auth, no TLS, emptyDir-like PVC.
apiVersion: v1
kind: Service
metadata: {name: kagent-pg, namespace: kagent}
spec:
  selector: {app: kagent-pg}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kagent-pg, namespace: kagent}
spec:
  serviceName: kagent-pg
  replicas: 1
  selector: {matchLabels: {app: kagent-pg}}
  template:
    metadata: {labels: {app: kagent-pg}}
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg17
        env:
        - {name: POSTGRES_DB, value: kagent}
        - {name: POSTGRES_USER, value: postgres}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: kagent-pg-admin, key: password}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        # TCP, not the socket: the image's first-boot temporary server listens on the socket only and is then stopped, so a socket probe
        # can report Ready just before the server restarts (psql then fails with "No such file or directory").
        readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 5}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 384Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 2Gi}}
