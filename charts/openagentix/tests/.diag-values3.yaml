diagnostics:
  enabled: true
  apiServerCIDRs:
    - 172.18.0.0/24
  cluster:
    enabled: true
    logNamespaces:
      - rca-demo
    statusNamespaces:
      - openagentix-knowledge
      - kagent
notify:
  enabled: true
mcp:
  profiles:
    - name: rca
      codeMode: false
      tools:
        cluster-read:
          - pods_list_in_namespace
          - pods_get
          - pods_log
          - events_list
          - workloads_list
          - workloads_get
          - nodes_list
          - nodes_get
        knowledge:
          - kb_search
          - kb_get_document
          - kb_list_collections
        delivery:
          - notify_send
          - notify_list_destinations
    - name: lookup
      codeMode: false
      tools:
        osv:
          - query_vulnerability
