agents:
  - name: assistant
    description: General assistant reachable from messaging channels
    model: claude-haiku
    modelConfigName: gateway-claude-haiku
    systemPrompt: 'You are a concise, helpful assistant running on a Kubernetes-native
      agent

      platform. Answers are read in a chat app, so keep them short and use plain text.

      Use the available tools when they help; say when you used one.

      '
    tools:
      - tools:
          - execute_tool_script
          - fetch_fetch
          - osv_get_vulnerability
          - osv_query_vulnerabilities_batch
          - osv_query_vulnerability
    skills:
      - openagentix-canary
    knowledge: true
    memory:
      enabled: true
      ttlDays: 30
  - name: rcaagent
    model: claude-haiku
    systemPrompt: You find root causes.
    toolProfile: rca
    knowledge: true
    notify:
      enabled: true
    tools:
      - tools:
          - cluster-read_pods_get
