{{- if .Values.kagent.enabled }}
{{- $k := .Values.kagent }}
{{- $modelNames := list }}
{{- range .Values.gateway.models }}{{ $modelNames = append $modelNames .name }}{{ end }}
{{- if $k.remoteMCPServer.enabled }}
---
# Agents reach the vMCP through this object. The URL is the Service the ToolHive operator creates (vmcp-<name>).
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $k.remoteMCPServer.name }}
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  description: ToolHive VirtualMCPServer ({{ .Values.mcp.virtual.name }})
  url: http://vmcp-{{ .Values.mcp.virtual.name }}.{{ .Values.mcp.namespace }}.svc.cluster.local:{{ .Values.mcp.virtual.port }}/mcp
  protocol: STREAMABLE_HTTP
  timeout: {{ $k.remoteMCPServer.timeout }}
  {{- if and .Values.mcp.enabled (eq .Values.mcp.virtual.incomingAuth.type "oidc") }}
  # Substrate's egress gateway attaches "Authorization: Bearer <JWT of the calling actor>" with this audience.
  actorJwt:
    audiences: [{{ .Values.mcp.virtual.incomingAuth.oidc.audience | quote }}]
    expirationSeconds: {{ .Values.mcp.virtual.incomingAuth.oidc.tokenExpirationSeconds }}
  {{- end }}
{{- if and .Values.mcp.enabled .Values.mcp.profiles }}
{{- $_ := include "oa.profilesCheck" . }}
{{- range $p := .Values.mcp.profiles }}
---
# One RemoteMCPServer per tool profile: an agent with toolProfile {{ $p.name }} reaches only this vMCP, with an actor JWT of this audience.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $k.remoteMCPServer.name }}-{{ $p.name }}
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  description: ToolHive VirtualMCPServer {{ $.Values.mcp.virtual.name }}-{{ $p.name }} (tool profile {{ $p.name }})
  url: http://vmcp-{{ $.Values.mcp.virtual.name }}-{{ $p.name }}.{{ $.Values.mcp.namespace }}.svc.cluster.local:{{ $.Values.mcp.virtual.port }}/mcp
  protocol: STREAMABLE_HTTP
  timeout: {{ $k.remoteMCPServer.timeout }}
  actorJwt:
    audiences: [{{ printf "%s-%s" $.Values.mcp.virtual.incomingAuth.oidc.audience $p.name | quote }}]
    expirationSeconds: {{ $.Values.mcp.virtual.incomingAuth.oidc.tokenExpirationSeconds }}
{{- end }}
{{- end }}
{{- end }}
{{- range $a := .Values.agents }}
{{- if not (has $a.model $modelNames) }}
{{- fail (printf "agent %q uses model %q which is not in gateway.models (%s)" $a.name $a.model (join ", " $modelNames)) }}
{{- end }}
---
# Holds only the agent's own gateway virtual key (Secret created by install.sh), never a provider key.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ include "oa.modelConfigName" $a }}
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
  annotations:
    openagentix.io/agent: {{ $a.name }}
spec:
  provider: OpenAI
  model: {{ $a.model }}
  apiKeySecret: {{ include "oa.virtualKeySecret" $a }}
  apiKeySecretKey: OPENAI_API_KEY
  stream: false
  openAI: {baseUrl: {{ include "oa.gatewayBaseUrl" $ | quote }}}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ $a.name }}-harness
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  {{- if and $a.memory $a.memory.enabled }}
  kagent:
    memory:
      modelConfigRef: {name: {{ $.Values.memory.modelConfig.name }}, namespace: {{ $k.namespace }}}
      {{- if $a.memory.ttlDays }}
      ttlDays: {{ int $a.memory.ttlDays }}
      {{- end }}
  {{- else }}
  kagent: {}
  {{- end }}
  {{- if and (include "oa.obsOn" $) $.Values.observability.baggage }}
  env:
    - {name: OTEL_PROPAGATORS, value: {{ include "oa.obsPropagators" $ | quote }}}
  {{- end }}
  workload:
    image: {{ default $k.harnessImage $a.harnessImage }}
  substrate:
    workerPoolRef: {name: {{ $k.workerPool }}}
    snapshotPolicy:
      location: {{ $k.snapshotLocation }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ $a.name }}-template
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  {{- if $a.description }}
  description: {{ $a.description | quote }}
  {{- end }}
  modelConfig: {name: {{ include "oa.modelConfigName" $a }}}
  {{- $prof := include "oa.agentProfile" (dict "root" $ "agent" $a) | fromJson }}
  {{- /* on a diagnostics profile (ADR 0025) the knowledge and notify tools are the entries of the group `diagnostics` (knowledge-diagnostics_...) */}}
  {{- $kn := and $.Values.knowledge.enabled $.Values.mcp.enabled $a.knowledge }}
  {{- $nt := and $.Values.notify.enabled $.Values.mcp.enabled $a.notify $a.notify.enabled }}
  {{- $prompt := required (printf "agents[%s].systemPrompt is required" $a.name) $a.systemPrompt }}
  {{- if $kn }}{{ $kp := include "oa.knowledgeAgentPrompt" $ | trim }}{{ $kp = include "oa.groupRename" (dict "root" $ "profile" $prof "text" $kp) }}{{ $prompt = printf "%s\n%s" (trim $prompt) $kp }}{{ end }}
  {{- if $nt }}{{ $np := include "oa.notifyAgentPrompt" $ | trim }}{{ $np = include "oa.groupRename" (dict "root" $ "profile" $prof "text" $np) }}{{ $prompt = printf "%s\n%s" (trim $prompt) $np }}{{ end }}
  {{- if and $a.memory $a.memory.enabled }}{{ $prompt = printf "%s\n%s" (trim $prompt) (trim $.Values.memory.agentPrompt) }}{{ end }}
  systemPrompt: {{ $prompt | toJson }}
  {{- $srv := $k.remoteMCPServer.name }}
  {{- if $prof }}{{ $srv = printf "%s-%s" $k.remoteMCPServer.name $prof.name }}{{ end }}
  {{- $entries := list }}
  {{- $merged := false }}
  {{- $extra := list }}
  {{- if $kn }}{{ $extra = concat $extra (include "oa.knowledgeTools" $ | fromJsonArray) }}{{ end }}
  {{- if $nt }}{{ $extra = concat $extra (include "oa.notifyTools" $ | fromJsonArray) }}{{ end }}
  {{- if $extra }}{{ $extra = include "oa.groupRename" (dict "root" $ "profile" $prof "text" (toJson $extra)) | fromJsonArray }}{{ end }}
  {{- range $t := $a.tools }}
  {{- $names := $t.tools }}
  {{- if and $extra (not $merged) (not $t.server) }}{{ $names = concat $names $extra }}{{ $merged = true }}{{ end }}
  {{- if and $prof $t.server (ne $t.server $srv) }}{{ fail (printf "agent %q uses toolProfile %q, so its tools cannot name another server (%q): that would be a path around the profile" $a.name $prof.name $t.server) }}{{ end }}
  {{- $entries = append $entries (dict "server" (default $srv $t.server) "tools" $names) }}
  {{- end }}
  {{- if and $extra (not $merged) }}{{ $entries = append $entries (dict "server" $srv "tools" $extra) }}{{ end }}
  {{- if $prof }}
  {{- $allowed := include "oa.profileToolNames" (dict "root" $ "profile" $prof) | fromJsonArray }}
  {{- range $t := $entries }}{{ range $n := $t.tools }}
  {{- if not (has $n $allowed) }}
  {{- if eq $n "execute_tool_script" }}{{ fail (printf "agent %q lists tool \"execute_tool_script\" but profile %q has codeMode off (set codeMode: true on the profile)" $a.name $prof.name) }}{{ end }}
  {{- fail (printf "agent %q lists tool %q which is not in profile %q (the profile offers: %s)" $a.name $n $prof.name (join ", " $allowed)) }}
  {{- end }}
  {{- end }}{{ end }}
  {{- end }}
  {{- if $entries }}
  tools:
    {{- range $t := $entries }}
    # no apiGroup: the kagent admission webhook rejects it for kind RemoteMCPServer
    - mcp:
        server: {kind: RemoteMCPServer, name: {{ $t.server }}}
        tools: {{ toJson $t.tools }}
    {{- end }}
  {{- end }}
  {{- if $a.skills }}
  skills:
    {{- range $sn := $a.skills }}
    {{- $sk := get $.Values.skills $sn }}
    {{- if not $sk }}{{ fail (printf "agent %q references skill %q which is not in .Values.skills" $a.name $sn) }}{{ end }}
    {{- if not (regexMatch "@sha256:[0-9a-f]{64}$" (toString $sk.oci)) }}{{ fail (printf "skill %q must be a digest-pinned OCI ref (...@sha256:<64 hex>), got %q" $sn $sk.oci) }}{{ end }}
    - name: {{ $sn }}
      source:
        oci: {{ $sk.oci }}
    {{- end }}
  {{- end }}
{{- $allow := include "oa.agentEgress" (dict "root" $ "agent" $a) | fromJsonArray }}
{{- if $allow }}
---
# Extra origins the sandbox of {{ $a.name }} may reach (agents[].egress.allow). The egress proxy matches host and port only.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: {{ $a.name }}-egress
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  destinations:
    {{- range $o := $allow }}
    - origin: {{ $o | quote }}
    {{- end }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ $a.name }}
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  template: {ref: {name: {{ $a.name }}-template}}
  harnessRef: {name: {{ $a.name }}-harness}
  {{- if $allow }}
  egressPolicyRefs:
    - name: {{ $a.name }}-egress
  {{- end }}
{{- end }}
{{- end }}
