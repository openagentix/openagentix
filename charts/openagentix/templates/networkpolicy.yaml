{{- if .Values.networkPolicy.enabled }}
{{- $n := .Values.networkPolicy }}
{{- if .Values.mcp.enabled }}
{{- $m := .Values.mcp }}
---
# MCP backends, their ToolHive proxies and the vMCP: reachable only from their own namespace (vMCP -> proxy ->
# server) and from the ToolHive operator. Everything else is dropped, including other agents' namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-mcp-tools-default
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $n.toolhiveNamespace }}}}
---
# The vMCP additionally takes calls from the agents' egress proxy (every sandbox tool call) and from the kagent
# controller (tool discovery for the RemoteMCPServer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-vmcp-ingress
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: virtualmcpserver, toolhive-name: {{ $m.virtual.name | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ $m.virtual.port }}}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $n.substrate.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.substrate.egressPodLabels | nindent 14 }}
        {{- if .Values.kagent.enabled }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.kagent.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.controllerPodLabels | nindent 14 }}
        {{- end }}
{{- range $p := $m.profiles }}
---
# Tool profile {{ $p.name }}: the same ingress as the shared vMCP (the egress proxy and the controller), for its own pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-vmcp-ingress-{{ $p.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: virtualmcpserver, toolhive-name: {{ printf "%s-%s" $m.virtual.name $p.name | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ $m.virtual.port }}}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $n.substrate.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.substrate.egressPodLabels | nindent 14 }}
        {{- if $.Values.kagent.enabled }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $.Values.kagent.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.controllerPodLabels | nindent 14 }}
        {{- end }}
{{- end }}
{{- range $w := (include "oa.caToolProfiles" . | fromJsonArray) }}
---
# Tool profile {{ $w.name }} for container agents (ADR 0019): only pods of the workload namespace that carry the profile's label reach its
# workload vMCP. The controller sets the label; the admission guard pins it to a listed profile.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-vmcp-ingress-{{ $w.name }}-workload
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: virtualmcpserver, toolhive-name: {{ $w.server | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ $w.port }}}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $.Values.controlPlane.containerAgents.namespace }}}}
          podSelector: {matchLabels: {openagentix.io/tool-profile: {{ $w.name | quote }}}}
{{- end }}
{{- if and (include "oa.obsOn" .) .Values.observability.bundled.enabled }}
---
# The bundled VictoriaMetrics scrapes the vMCP's Prometheus port (ToolHive diagnostics, 9464). Nothing else is added.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-vmcp-metrics
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: virtualmcpserver, toolhive-name: {{ $m.virtual.name | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 9464}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.observability.namespace }}}}
          podSelector: {matchLabels: {app: victoria-metrics}}
{{- range $p := $m.profiles }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-vmcp-metrics-{{ $p.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: virtualmcpserver, toolhive-name: {{ printf "%s-%s" $m.virtual.name $p.name | quote }}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 9464}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $.Values.observability.namespace }}}}
          podSelector: {matchLabels: {app: victoria-metrics}}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.kagent.enabled }}
{{- $k := .Values.kagent }}
---
# kagent controller: A2A and the REST API were open to every pod. Allowed on its port: the Telegram bridge pod
# (by pod label), the kagent UI pods and the Substrate egress proxy that carries
# the sandboxes' task-store calls. Any other port stays reachable, as before (the controller serves only this one).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-kagent-controller
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml $n.controllerPodLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ $n.controllerPort }}}]
      from:
        # The kagent UI proxies /api/ to the controller. No other pod of the kagent namespace calls this port: the tools
        # server and the worker pool do not, and the sandboxes' calls arrive through the egress proxy below.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $k.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.kagentUI.podLabels | nindent 14 }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $n.substrate.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml $n.substrate.egressPodLabels | nindent 14 }}
        {{- if include "oa.a2aGateOn" . }}
        # A2A gate on (governance.a2a): the bridge, Kourier, the schedules and extraA2ACallers call the gate, which admits them.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.governance.a2a.namespace }}}}
          podSelector: {matchLabels: {app: a2a-gate}}
        {{- else }}
        {{- if .Values.bridge.enabled }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.bridge.namespace }}}}
          podSelector: {matchLabels: {app: telegram-bridge}}
        {{- end }}
        {{- if .Values.channels.kourier.enabled }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.channels.kourier.broker.namespace | quote }}}}
          podSelector:
            matchLabels: {{- toYaml .Values.channels.kourier.broker.podLabels | nindent 14 }}
        {{- end }}
        {{- if .Values.schedules }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.scheduling.namespace | quote }}}}
          podSelector:
            matchLabels: {{- toYaml .Values.scheduling.podLabel | nindent 14 }}
        {{- end }}
        {{- range $n.extraA2ACallers }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace | quote }}}}
          {{- if .podLabels }}
          podSelector:
            matchLabels: {{- toYaml .podLabels | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- end }}
    - ports:
        - {protocol: TCP, port: 1, endPort: {{ sub (int $n.controllerPort) 1 }}}
        - {protocol: TCP, port: {{ add (int $n.controllerPort) 1 }}, endPort: 65535}
---
# kagent UI: closed to every pod. Its nginx forwards X-User-Id and proxies the controller's whole API (memory, sessions, A2A over
# gRPC-Web), so an open UI is an open relay around the A2A gate. `kubectl port-forward` still works (the kubelet connects
# inside the pod's network namespace). Peers that may reach it: networkPolicy.kagentUI.allowFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openagentix-kagent-ui
  namespace: {{ $k.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml $n.kagentUI.podLabels | nindent 6 }}
  policyTypes: [Ingress]
  {{- if $n.kagentUI.allowFrom }}
  ingress:
    - ports: [{protocol: TCP, port: {{ $n.kagentUI.port }}}]
      from:
        {{- range $n.kagentUI.allowFrom }}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace | quote }}}}
          {{- if .podLabels }}
          podSelector:
            matchLabels: {{- toYaml .podLabels | nindent 14 }}
          {{- end }}
        {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
