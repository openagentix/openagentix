{{- $_ := include "oa.bridgeMemoryCheck" . }}
{{- if .Values.bridge.enabled }}
{{- $b := .Values.bridge }}
{{- include "oa.pdb" (dict "root" $ "name" "telegram-bridge" "app" "telegram-bridge" "ns" $b.namespace) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bridge
  namespace: {{ $b.namespace }}
  labels:
    app: telegram-bridge
    {{- include "oa.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # only one poller may use a bot token at a time
  selector:
    matchLabels: {app: telegram-bridge}
  template:
    metadata:
      labels:
        app: telegram-bridge
        {{- include "oa.labels" . | nindent 8 }}
      {{- if $b.sourceHash }}
      annotations:
        # set by install.sh from the content of bridges/telegram: a code change rolls the pod although the image tag stays "dev"
        openagentix.io/source-hash: {{ $b.sourceHash | quote }}
      {{- end }}
    spec:
      {{- with include "oa.priorityClass" $ }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if include "oa.a2aGateOn" . }}
      serviceAccountName: telegram-bridge
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if not (include "oa.openshift" $) }}
        runAsUser: 65532
        runAsGroup: 65532
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: {{ include "oa.image" (list $b.image "bridge") | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          env:
            - name: A2A_URL
              {{- if include "oa.a2aGateOn" . }}
              value: {{ default (printf "%s/agents/%s/%s" (include "oa.a2aGateUrl" .) $b.agentNamespace $b.agent) $b.a2aUrl | quote }}
              {{- else }}
              value: {{ default (printf "http://kagent-controller.%s.svc.cluster.local:8083/agents/%s/%s" $b.agentNamespace $b.agentNamespace $b.agent) $b.a2aUrl | quote }}
              {{- end }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $b.existingSecret | quote }}, key: {{ $b.tokenKey | quote }}}
            {{- if $b.allowlist.enabled }}
            # Comma-separated chat ids allowed to talk to the agent. The bridge refuses to
            # start when this is empty, so a missing key cannot silently open the bot.
            - name: TELEGRAM_ALLOWED_CHAT_IDS
              valueFrom:
                secretKeyRef: {name: {{ $b.existingSecret | quote }}, key: {{ $b.allowlist.secretKey | quote }}, optional: true}
            {{- else }}
            # Explicit opt-in: anyone who finds the bot can talk to the agent.
            - name: TELEGRAM_ALLOW_ALL
              value: "true"
            {{- end }}
            {{- if $b.userIdPrefix }}
            - name: A2A_USER_ID_PREFIX
              value: {{ $b.userIdPrefix | quote }}
            {{- end }}
            {{- if $b.agentTimeout }}
            - name: AGENT_TIMEOUT
              value: {{ $b.agentTimeout | quote }}
            {{- end }}
            {{- if include "oa.a2aGateOn" . }}
            # a projected ServiceAccount token (audience of the A2A gate), re-read by the bridge on every request
            - {name: A2A_TOKEN_FILE, value: /var/run/a2a/token}
            {{- end }}
            {{- if $b.memoryCommands }}
            # /memories and /forget: two RPCs of kagent's memory service through the gate (ADR 0006, round 3). The gate checks the user id and the agent.
            - {name: MEMORY_GATE_URL, value: {{ include "oa.a2aGateUrl" . | quote }}}
            - {name: MEMORY_AGENT, value: {{ printf "%s/%s" $b.agentNamespace $b.agent | quote }}}
            {{- end }}
          ports:
            - {name: health, containerPort: 8080}
          # /readyz is 503 until the first getUpdates succeeds, so a rollout waits
          # for a bridge that really polls. The first long poll can take 30 s, so
          # the startup probe allows 2 minutes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          # /healthz turns 503 when no Telegram poll has succeeded recently, so a
          # stalled poller gets restarted. It counts the start-up moment as fresh.
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if include "oa.a2aGateOn" . }}
          volumeMounts:
            - {name: a2a-token, mountPath: /var/run/a2a, readOnly: true}
          {{- end }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
      {{- if include "oa.a2aGateOn" . }}
      volumes:
        - name: a2a-token
          projected:
            sources:
              - serviceAccountToken: {audience: {{ .Values.governance.a2a.audience | quote }}, expirationSeconds: 3600, path: token}
      {{- end }}
{{- if include "oa.a2aGateOn" . }}
---
# The gate knows the bridge by this ServiceAccount (rule "bridge"). The token is projected into the pod; the default token mount stays off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telegram-bridge
  namespace: {{ $b.namespace }}
  labels:
    app: telegram-bridge
    {{- include "oa.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
