{{- if .Values.mcp.enabled }}
{{- $m := .Values.mcp }}
{{- $_ := include "oa.profilesCheck" . }}
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: {{ $m.groupName }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  description: Backend MCP servers aggregated by the vMCP
{{- range $s := $m.servers }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $s.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  groupRef: {name: {{ $m.groupName }}}
  image: {{ $s.image }}
  transport: {{ default "streamable-http" $s.transport }}
  proxyPort: {{ default 8080 $s.proxyPort }}
  mcpPort: {{ default 8080 $s.port }}
  resources: {{- toYaml (default $m.serverResources $s.resources) | nindent 4 }}
{{- end }}
{{- $ia := $m.virtual.incomingAuth }}
{{- if not (has $ia.type (list "anonymous" "oidc")) }}{{ fail (printf "mcp.virtual.incomingAuth.type must be anonymous or oidc, got %q" $ia.type) }}{{ end }}
{{- $policies := $ia.policies }}
{{- if $ia.toolAccess }}
{{- if ne $ia.type "oidc" }}{{ fail "mcp.virtual.incomingAuth.toolAccess needs type oidc: an anonymous caller has no identity to key on" }}{{ end }}
{{- $policies = list }}
{{- range $r := $ia.toolAccess }}{{ range $t := $r.tools }}
{{- $policies = append $policies (printf "permit(principal, action == Action::\"call_tool\", resource == Tool::%s) when { context[\"claim_actor.ate.dev\"].atespace == %s };" (quote $t) (quote $r.atespace)) }}
{{- end }}{{ end }}
{{- end }}
{{- if include "oa.diagOn" . }}
{{- /* ADR 0025: the diagnostics tools live in a group of their own, which this vMCP does not reference. A forbid on each tool name, in front of the
permit, is the second layer: an entry that is put into this group by mistake is still refused (a direct call and a code mode call). */}}
{{- $forbids := list }}
{{- range $t := (include "oa.diagClusterTools" . | fromJsonArray) }}{{ $forbids = append $forbids (printf "forbid(principal, action == Action::\"call_tool\", resource == Tool::%s);" (quote (printf "%s%s" (replace "{workload}" "cluster-read" $m.virtual.prefixFormat) $t))) }}{{ end }}
{{- $policies = concat $forbids $policies }}
{{- end }}
{{- if include "oa.epOn" . }}
{{- /* ADR 0026: endpoint tools live in a group of their own, which this vMCP does not reference. A forbid on each endpoint tool that a profile lists, in front of
the permit, is the second layer: an entry that is put into this group by mistake is still refused (a direct call and a code mode call). */}}
{{- $eforbids := list }}
{{- $enames := include "oa.epNames" . | fromJsonArray }}
{{- range $p := ($m.profiles | default list) }}{{ range $w := (keys $p.tools | sortAlpha) }}{{ if has $w $enames }}{{ range $t := (index $p.tools $w) }}
{{- $eforbids = append $eforbids (printf "forbid(principal, action == Action::\"call_tool\", resource == Tool::%s);" (quote (printf "%s%s" (replace "{workload}" $w $m.virtual.prefixFormat) $t))) }}
{{- end }}{{ end }}{{ end }}{{ end }}
{{- $policies = concat ($eforbids | uniq) $policies }}
{{- end }}
{{- if eq $ia.type "oidc" }}
---
# Validates the per-actor JWT that Substrate injects (RemoteMCPServer.spec.actorJwt). Issuer, keys and CA come
# from values; nothing is fetched insecurely.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: {{ $ia.oidc.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  type: inline
  inline:
    issuer: {{ $ia.oidc.issuer | quote }}
    jwksUrl: {{ $ia.oidc.jwksUrl | quote }}
    {{- if $ia.oidc.jwksAllowPrivateIP }}
    jwksAllowPrivateIP: true
    {{- end }}
    caBundleRef:
      configMapRef: {name: {{ $ia.oidc.caBundle.configMap | quote }}, key: {{ $ia.oidc.caBundle.key | quote }}}
{{- end }}
---
# incomingAuth is oidc (Substrate actor JWT) by default; Cedar then authorizes the authenticated caller.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: {{ $m.virtual.name }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  groupRef: {name: {{ $m.groupName }}}
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig: {prefixFormat: {{ $m.virtual.prefixFormat | quote }}}
    {{- if $m.virtual.codeMode.enabled }}
    codeMode:
      enabled: true
      stepLimit: {{ $m.virtual.codeMode.stepLimit }}
      parallelMaxConcurrency: {{ $m.virtual.codeMode.parallelMaxConcurrency }}
      toolCallTimeout: {{ $m.virtual.codeMode.toolCallTimeout }}
    {{- end }}
    {{- if and (include "oa.obsOn" .) .Values.observability.audit.enabled }}
    # Audit events: tool name, outcome, caller subject (the actor JWT sub, which carries the session id), sizes.
    # Request and response data are included only when observability.capture.content is true.
    audit:
      enabled: true
      includeRequestData: {{ include "oa.obsCapture" . }}
      includeResponseData: {{ include "oa.obsCapture" . }}
    {{- end }}
  {{- if include "oa.obsOn" . }}
  telemetryConfigRef: {name: openagentix-telemetry}
  {{- end }}
  incomingAuth:
    type: {{ $ia.type }}
    {{- if eq $ia.type "oidc" }}
    oidcConfigRef: {name: {{ $ia.oidc.name }}, audience: {{ $ia.oidc.audience | quote }}}
    {{- end }}
    authzConfig:
      type: inline
      inline:
        policies: {{ toJson $policies }}
  outgoingAuth: {source: discovered}
{{- /* Tools for container agents (ADR 0019): profiles listed in controlPlane.containerAgents.toolProfiles get a second object below (variant
"workload") with the same filter and code mode, and an incomingAuth of its own. Empty list (the default): nothing changes. */}}
{{- $wl := include "oa.caToolProfiles" . | fromJsonArray }}
{{- $wlNames := list }}{{ range $w := $wl }}{{ $wlNames = append $wlNames $w.name }}{{ end }}
{{- if $wl }}
---
# Validates the Kubernetes ServiceAccount tokens of container agents (ADR 0019). The keys are fetched from the API server with the vMCP's
# own token and the cluster CA (useClusterAuth). The audience is set per server, so one config serves every opened profile.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: openagentix-workload-sa
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  type: kubernetesServiceAccount
  kubernetesServiceAccount:
    issuer: {{ .Values.controlPlane.containerAgents.serviceAccountTokens.issuer | quote }}
    jwksUrl: {{ .Values.controlPlane.containerAgents.serviceAccountTokens.jwksUrl | quote }}
    {{- /* the vMCP's own token and the cluster CA go only to the in-cluster API server, never to another host */}}
    useClusterAuth: {{ regexMatch "^https://kubernetes[.]default[.]svc([.]cluster[.]local)?(:[0-9]+)?(/|$)" .Values.controlPlane.containerAgents.serviceAccountTokens.jwksUrl }}
{{- end }}
{{- range $p := $m.profiles }}
{{- /* a profile that lists a diagnostics tool lives on the group `diagnostics` (ADR 0025, Amendment 1), one that lists an endpoint on the group of that endpoint
(ADR 0026): its own entries, audit data off */}}
{{- $grp := include "oa.profileGroup" (dict "root" $ "profile" $p) }}
{{- $variants := list "" }}{{ if has $p.name $wlNames }}{{ $variants = append $variants "workload" }}{{ end }}
{{- range $v := $variants }}
---
{{- if $v }}
# Tool profile {{ $p.name }} for container agents (ADR 0019): the same tools as {{ $m.virtual.name }}-{{ $p.name }}, but it accepts a Kubernetes
# ServiceAccount token with its own audience, and the policy admits only pod-bound tokens of subjects of the workload namespace. Any pod can
# get a token with this audience for its own ServiceAccount, so the namespace rule keeps other namespaces out; the admission policies
# openagentix-workload-tool-identity and -token-request keep such tokens in the workload namespace to the controller's pods.
{{- else }}
# Tool profile {{ $p.name }} (ADR 0006, round 2): a second vMCP on the same MCPGroup that advertises only the tools listed in the profile.
# defaultToolVisibility deny: a backend without an entry below contributes nothing. A hidden tool is also not callable through
# this server (not found, code mode included); the filter is the limit, so the policy allows every authenticated call. The
# audience is its own: the actor token of an agent on this profile is useless at the shared vMCP, and the agent's sandbox
# gets no JWT for the shared vMCP at all (its egress allowlist names only the origins of the agent's own tool servers).
{{- end }}
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: {{ $m.virtual.name }}-{{ $p.name }}{{ if $v }}-workload{{ end }}
  namespace: {{ $m.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
  annotations:
    openagentix.io/tool-profile: {{ $p.name }}
spec:
  groupRef: {name: {{ default $m.groupName $grp }}}
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig: {prefixFormat: {{ $m.virtual.prefixFormat | quote }}}
      defaultToolVisibility: deny
      tools:
        {{- range $w := (keys $p.tools | sortAlpha) }}
        - workload: {{ include "oa.groupWorkload" (dict "root" $ "profile" $p "w" $w) }}
          filter: {{ toJson (index $p.tools $w) }}
        {{- end }}
    {{- if $p.codeMode }}
    codeMode:
      enabled: true
      stepLimit: {{ $m.virtual.codeMode.stepLimit }}
      parallelMaxConcurrency: {{ $m.virtual.codeMode.parallelMaxConcurrency }}
      toolCallTimeout: {{ $m.virtual.codeMode.toolCallTimeout }}
    {{- end }}
    {{- if $grp }}
    # Tool arguments and results (log lines, events, case data) are never copied into the audit, whatever the observability values say (ADR 0025 section 6, ADR 0026 decision 5).
    audit:
      enabled: true
      includeRequestData: false
      includeResponseData: false
    {{- else if and (include "oa.obsOn" $) $.Values.observability.audit.enabled }}
    audit:
      enabled: true
      includeRequestData: {{ include "oa.obsCapture" $ }}
      includeResponseData: {{ include "oa.obsCapture" $ }}
    {{- end }}
  {{- if include "oa.obsOn" $ }}
  telemetryConfigRef: {name: openagentix-telemetry}
  {{- end }}
  incomingAuth:
    type: oidc
    {{- if $v }}
    oidcConfigRef: {name: openagentix-workload-sa, audience: {{ printf "%s-%s-workload" $ia.oidc.audience $p.name | quote }}}
    authzConfig:
      type: inline
      inline:
        policies: [{{ printf "permit(principal, action, resource) when { context.claim_sub like \"system:serviceaccount:%s:*\" && context has \"claim_kubernetes.io\" && context[\"claim_kubernetes.io\"] has pod };" $.Values.controlPlane.containerAgents.namespace | quote }}]
    {{- else }}
    oidcConfigRef: {name: {{ $ia.oidc.name }}, audience: {{ printf "%s-%s" $ia.oidc.audience $p.name | quote }}}
    authzConfig:
      type: inline
      inline:
        policies: ["permit(principal, action, resource);"]
    {{- end }}
  outgoingAuth: {source: discovered}
{{- end }}
{{- end }}
{{- end }}
