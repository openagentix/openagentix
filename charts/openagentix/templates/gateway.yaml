{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- /* ADR 0023: "" (default, nothing renders), ClusterIP or LoadBalancer. Case matters. */ -}}
{{- $st := toString (default "" $g.serviceType) }}
{{- if not (has $st (list "" "ClusterIP" "LoadBalancer")) }}
{{- fail (printf "gateway.serviceType must be empty, ClusterIP or LoadBalancer (case matters), got %q" $st) }}
{{- end }}
# Listener must list AgentgatewayModel in allowedRoutes.kinds, otherwise /v1/chat/completions is not served.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ $g.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  {{- if $st }}
  infrastructure:
    parametersRef: {group: agentgateway.dev, kind: AgentgatewayParameters, name: {{ $g.name }}-parameters}
  {{- end }}
  listeners:
    - name: http
      port: {{ $g.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: All}
        kinds:
          - {group: gateway.networking.k8s.io, kind: HTTPRoute}
          - {group: agentgateway.dev, kind: AgentgatewayModel}
{{- if $st }}
---
# ADR 0023: the Service type of the proxy, set through agentgateway's strategic-merge overlay (spec.service.spec). Nothing else.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $g.name }}-parameters
  namespace: {{ $g.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  service:
    spec:
      type: {{ $st }}
{{- end }}
{{- range $m := $g.models }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ $m.name }}
  namespace: {{ $g.namespace }}
  labels: {{- include "oa.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ $g.name }}, sectionName: http}
  {{- if $m.failover }}
  virtualModel:
    failover:
      targets:
        {{- range $i, $t := $m.failover }}
        - {modelRef: {name: {{ $t }}}, priority: {{ $i }}}
        {{- end }}
  {{- else }}
  provider: {{ required (printf "gateway.models[%s].provider is required" $m.name) $m.provider }}
  {{- if $m.baseURL }}
  baseURL: {{ $m.baseURL }}
  {{- end }}
  {{- if or $m.authSecret $m.upstreamModel $m.health }}
  policies:
    {{- if $m.authSecret }}
    auth:
      secretRef: {name: {{ $m.authSecret }}}
    {{- end }}
    {{- if $m.upstreamModel }}
    transformations:
      - field: model
        expression: {{ printf "\"%s\"" $m.upstreamModel | squote }}
    {{- end }}
    {{- if $m.health }}
    health: {{- toYaml $m.health | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
---
# ONE policy on the Gateway: virtual-key auth + per-key token budget + retry (spec.traffic) and
# per-key attribution of access logs and metrics (spec.frontend).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $g.policy.name }}
  namespace: {{ $g.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ $g.name }}}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector:
        matchLabels:
          {{ $g.policy.apiKeyLabel }}: "true"
    rateLimit:
      local:
        - tokens: {{ $g.policy.tokenBudget.tokens | int64 }}
          unit: {{ $g.policy.tokenBudget.unit }}
          key: apiKey.user_id
    retry:
      attempts: {{ $g.policy.retry.attempts }}
      codes: {{ toJson $g.policy.retry.codes }}
  {{- if $g.policy.promptCaching.enabled }}
  {{- $pc := $g.policy.promptCaching }}
  # Anthropic prompt caching: the gateway adds the cache marks (a client's own marks win).
  backend:
    ai:
      promptCaching:
        cacheSystem: {{ $pc.cacheSystem }}
        cacheMessages: {{ $pc.cacheMessages }}
        cacheTools: {{ $pc.cacheTools }}
        minTokens: {{ int $pc.minTokens }}
  {{- end }}
  {{- $trace := and (include "oa.obsOn" .) .Values.observability.tracing.enabled }}
  {{- if or $g.policy.attributeUserId $trace }}
  frontend:
    {{- if $g.policy.attributeUserId }}
    accessLog:
      attributes:
        add:
          - {name: user_id, expression: apiKey.user_id}
    metrics:
      attributes:
        add:
          - {name: user_id, expression: apiKey.user_id}
    {{- end }}
    {{- if $trace }}
    # Tracing: default span attributes only (no prompt or completion), the incoming traceparent is continued and passed upstream.
    tracing:
      url: {{ include "oa.obsEndpoint" . | quote }}
      protocol: {{ ternary "GRPC" "HTTP" (eq .Values.observability.otlp.protocol "grpc") }}
      randomSampling: {{ .Values.observability.tracing.samplingRate | toString | quote }}
    {{- end }}
  {{- end }}
{{- end }}
