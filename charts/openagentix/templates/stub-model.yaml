{{- /* Scenario files (ADR 0026, B). Checked first, also while the stub is off, so that files that would have no effect are refused. */ -}}
{{- $scn := (.Values.gateway.stubModel.scenarios | default dict) }}
{{- $scnFiles := ($scn.files | default dict) }}
{{- if not (kindIs "map" $scnFiles) }}{{ fail "gateway.stubModel.scenarios.files must be a map from a file name to the JSON text of a scenario file" }}{{ end }}
{{- if and $scnFiles (not (and .Values.gateway.enabled .Values.gateway.stubModel.enabled)) }}
{{- fail "gateway.stubModel.scenarios.files has no effect while gateway.stubModel.enabled is false (or the gateway is off): turn the stub model on, or leave the files out. The stub is a test component." }}
{{- end }}
{{- $scnTotal := 0 }}
{{- range $name, $text := $scnFiles }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}[.]json$" $name) }}
{{- fail (printf "gateway.stubModel.scenarios.files: the file name %q is not allowed: use lowercase letters, digits and dashes, at most 63 characters, then .json" $name) }}
{{- end }}
{{- if not (kindIs "string" $text) }}
{{- fail (printf "gateway.stubModel.scenarios.files.%s must be a string with the JSON text of a scenario file (pass the file with --set-file, or use install.sh STUB_SCENARIOS)" $name) }}
{{- end }}
{{- $doc := fromJson $text }}
{{- if and (hasKey $doc "Error") (not (hasKey $doc "scenarios")) }}
{{- fail (printf "gateway.stubModel.scenarios.files.%s is not a JSON object" $name) }}
{{- end }}
{{- if not (kindIs "slice" $doc.scenarios) }}
{{- fail (printf "gateway.stubModel.scenarios.files.%s has no \"scenarios\" list" $name) }}
{{- end }}
{{- $scnTotal = add $scnTotal (len $text) }}
{{- end }}
{{- if gt (int $scnTotal) 262144 }}
{{- fail (printf "gateway.stubModel.scenarios.files hold %d bytes, more than the limit of 262144 (256 KiB): a ConfigMap and a Helm release are limited to 1 MiB" (int $scnTotal)) }}
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.stubModel.enabled }}
{{- $g := .Values.gateway }}
{{- $s := $g.stubModel }}
# Stub model (ADR 0014): a scripted OpenAI-compatible server, for trying the platform without a model provider key. It is NOT a
# language model. A `gateway.models` entry points at it (baseURL http://stub-model.<gateway namespace>.svc.cluster.local:8080/v1), so
# virtual keys, budgets and metrics work as with a real provider. Only the gateway's proxy pods may call it, and it may call nothing.
apiVersion: v1
kind: Service
metadata:
  name: stub-model
  namespace: {{ $g.namespace }}
  labels:
    app: stub-model
    {{- include "oa.labels" . | nindent 4 }}
spec:
  selector: {app: stub-model}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
{{- include "oa.pdb" (dict "root" $ "name" "stub-model" "app" "stub-model" "ns" $g.namespace) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-model
  namespace: {{ $g.namespace }}
  labels:
    app: stub-model
    {{- include "oa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: stub-model}
  template:
    metadata:
      labels:
        app: stub-model
        {{- include "oa.labels" . | nindent 8 }}
      {{- if or $s.sourceHash $scnFiles }}
      annotations:
        {{- if $scnFiles }}
        openagentix.io/scenarios-checksum: {{ toJson $scnFiles | sha256sum | quote }}   # a change of a scenario file rolls the pod
        {{- end }}
        {{- if $s.sourceHash }}
        openagentix.io/source-hash: {{ $s.sourceHash | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- with include "oa.priorityClass" $ }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if not (include "oa.openshift" $) }}
        runAsUser: 65532
        runAsGroup: 65532
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stub-model
          image: {{ include "oa.image" (list $s.image "gateway.stubModel") | quote }}
          imagePullPolicy: {{ $s.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml $s.resources | nindent 12 }}
          {{- if $scnFiles }}
          env:
            - {name: STUB_MODEL_SCENARIOS, value: /etc/stub-model/scenarios}
          volumeMounts:
            - {name: scenarios, mountPath: /etc/stub-model/scenarios, readOnly: true}
          {{- end }}
      {{- if $scnFiles }}
      volumes:
        - name: scenarios
          configMap: {name: stub-model-scenarios}
      {{- end }}
{{- if $scnFiles }}
---
# Scenario files for the stub model (ADR 0026, B): a test value, filled by install.sh STUB_SCENARIOS. A run that uses them is a SCRIPTED run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stub-model-scenarios
  namespace: {{ $g.namespace }}
  labels:
    app: stub-model
    {{- include "oa.labels" . | nindent 4 }}
data:
  {{- range $name, $text := $scnFiles }}
  {{ $name }}: {{ toJson $text }}
  {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stub-model
  namespace: {{ $g.namespace }}
  labels: {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: stub-model}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
      from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $g.namespace }}}}
          podSelector: {matchLabels: {gateway.networking.k8s.io/gateway-name: {{ $g.name }}}}
{{- end }}
