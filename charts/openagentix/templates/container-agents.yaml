{{- /*
Bring your own agent (ADR 0015, issue #43): the workload namespace of container agents and what the controller needs to run them there.
Renders nothing unless controlPlane.enabled and controlPlane.containerAgents.enabled are both true (with either off the chart renders
byte-identically to a chart without this file). The pieces:
  - the workload namespace, Pod Security `restricted` (enforce, audit, warn), and a deny-by-default NetworkPolicy for every pod in it. The
    controller adds one NetworkPolicy per agent (ingress from the A2A gate only; egress to DNS and the model gateway only);
  - the controller's namespaced Role and RoleBinding there. Secrets: create and delete only, never get, list or watch;
  - the gate's route list ConfigMap (the controller is its only writer; the gate mounts it; it holds namespace/name entries, never a URL) and the
    controller's Role for it (get and patch of that one ConfigMap).
What the controller may write there is limited again by the guard (control-plane-guard-workload.yaml). The chart never renders a Secret.
*/ -}}
{{- if include "oa.caOn" . }}
{{- $_ := include "oa.cpCheck" . }}
{{- $ca := .Values.controlPlane.containerAgents }}
{{- $wns := $ca.namespace }}
{{- $cpns := include "oa.cpNamespace" . }}
{{- $gate := .Values.governance.a2a.namespace }}
{{- $sa := "openagentix-control-plane" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $wns }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app: container-agents
    {{- include "oa.labels" . | nindent 4 }}
---
# Every pod of the namespace starts with no ingress and no egress. The controller's per-agent NetworkPolicy opens exactly two things for that agent's pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $wns }}
  labels:
    app: container-agents
    {{- include "oa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Namespaced, no wildcard. Secrets: create and delete only (the controller can never read a key back).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $wns }}
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $wns }}
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $sa }}}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $cpns }}}
---
# The gate's route list. The data below is only the empty start: the controller rewrites routes.json, and Helm's three-way merge leaves a key alone
# when the chart did not change it. Kept on uninstall so that a re-install does not drop live routes before the controller has resynced them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: a2a-gate-routes
  namespace: {{ $gate }}
  labels:
    app: a2a-gate
    {{- include "oa.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  routes.json: '{"container":[]}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}-routes
  namespace: {{ $gate }}
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [a2a-gate-routes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}-routes
  namespace: {{ $gate }}
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $sa }}-routes}
subjects:
  - {kind: ServiceAccount, name: {{ $sa }}, namespace: {{ $cpns }}}
{{- if include "oa.caToolProfiles" . | fromJsonArray }}
{{- /* Tools for container agents (ADR 0019): the workload tool servers admit pod-bound ServiceAccount tokens of the workload namespace. These two
policies limit who can make such a token there, for EVERY user (cluster admins included) except the controller, whose own writes the workload guard
judges, and the cluster's controllers in kube-system, which only copy templates that were judged here. */}}
{{- $ctrl := printf "system:serviceaccount:%s:%s" $cpns $sa }}
{{- $sat := $ca.serviceAccountTokens }}
{{- if and $sat.anonymousKeys (regexMatch "^https://kubernetes[.]default[.]svc([.]cluster[.]local)?(:[0-9]+)?(/|$)" $sat.jwksUrl) }}
---
# The workload vMCP fetches the API server's public signing keys without a token (ToolHive 0.67.1 does not pass one to a vMCP), so the
# built-in discovery role (the issuer document and the public keys, nothing else) is bound to unauthenticated callers. Public keys only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openagentix-workload-sa-keys
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:service-account-issuer-discovery"}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:unauthenticated"}
{{- end }}
---
# No pod and no pod template in the workload namespace may carry a projected ServiceAccount token or the tool-profile label, unless the
# controller wrote it. Covers every kind that makes pods (a Job, a StatefulSet or a bare Pod would otherwise go around the Deployment guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openagentix-workload-tool-identity
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [pods, replicationcontrollers]}
      - {apiGroups: [apps], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [deployments, replicasets, statefulsets, daemonsets]}
      - {apiGroups: [batch], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [jobs, cronjobs]}
  matchConditions:
    - name: the-workload-namespace
      expression: {{ printf "request.namespace == %s" ($wns | toJson) | toJson }}
    - name: not-the-controller-nor-the-cluster-controllers
      expression: {{ printf "!(request.userInfo.username == %s || request.userInfo.username == 'system:kube-controller-manager' || request.userInfo.username.startsWith('system:serviceaccount:kube-system:'))" ($ctrl | toJson) | toJson }}
  variables:
    - name: t
      expression: "request.resource.resource == 'pods' ? dyn(object) : (request.resource.resource == 'cronjobs' ? dyn(object).spec.jobTemplate.spec.template : dyn(object).spec.template)"
  validations:
    - message: "in the workload namespace only the control plane may label a pod with openagentix.io/tool-profile"
      expression: "!has(variables.t.metadata) || !has(variables.t.metadata.labels) || !('openagentix.io/tool-profile' in variables.t.metadata.labels)"
    - message: "in the workload namespace only the control plane may give a pod a projected ServiceAccount token"
      expression: "!has(variables.t.spec) || !has(variables.t.spec.volumes) || variables.t.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.serviceAccountToken)))"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openagentix-workload-tool-identity
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
spec:
  policyName: openagentix-workload-tool-identity
  validationActions: [Deny]
---
# In the workload namespace only the kubelet may ask for a ServiceAccount token (for a pod it runs). `kubectl create token` there is refused.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openagentix-workload-token-request
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: ["*"], operations: [CREATE], resources: [serviceaccounts/token]}
  matchConditions:
    - name: the-workload-namespace
      expression: {{ printf "request.namespace == %s" ($wns | toJson) | toJson }}
    - name: not-a-node
      expression: "!request.userInfo.username.startsWith('system:node:')"
  validations:
    - message: "in the workload namespace only the kubelet may request a ServiceAccount token"
      expression: "false"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openagentix-workload-token-request
  labels:
    app: control-plane
    {{- include "oa.labels" . | nindent 4 }}
spec:
  policyName: openagentix-workload-token-request
  validationActions: [Deny]
{{- end }}
{{- end }}
