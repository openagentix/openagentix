# A container agent: the platform runs this image under the agent's own gateway key (ADR 0015).
# Replace the image with your build, pinned by digest, from a registry the operator allows
# (controlPlane.policy.runtimes.container.images). The quick start does this for you: QUICKSTART_BYO=1.
apiVersion: openagentix.io/v1alpha1
kind: AgentDefinition
metadata:
  name: echo-go
  namespace: kagent
spec:
  description: A sample agent built with Go's standard library
  model: quickstart-model
  runtime:
    type: container
    container:
      image: IMAGE_REGISTRY/echo-a2a@sha256:IMAGE_DIGEST
      port: 8080
