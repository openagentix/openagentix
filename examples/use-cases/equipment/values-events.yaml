# The event caller of the equipment use case (ADR 0027, slices 5 and 6). Composed ONLY when install.sh runs with EVENTS=1: without it the gate carries no rule for the
# records service and admits none of its pods, and the platform values are exactly what they were before the sender existed. It is the same file for the quick
# start path (values.yaml) and the full demo path (values-full-demo.yaml). Another use case's file is listed in ALSO_COMPOSE next to its values-full-demo.yaml
# (examples/use-cases/equipment/README.md, "Event triggers").
governance:
  a2a:
    callers:
      # The records service as an EVENT CALLER (ADR 0027): a fault or a service request that its intake route accepts opens a case and starts the service agent
      # with one short text, "Work case SVC-2026-0007", and nothing else. The ServiceAccount records-events is the pod's own (manifests/records.yaml) and is not
      # a person: the gate sets the user id event:kestrel-fault-events itself. The text names the case, never the dealer's words; those stay in the record, where
      # the agent reads them as untrusted fields. Chart agents only: service-agent has no long-term memory, as an event caller requires.
      # The numbers come from the measured runs (README, "Event triggers"): a case costs about 70,000 tokens, the budget class equipment-case-agent lets the key of the agent use 800,000 tokens an hour (values.yaml). A burst of
      # 3 starts at most 3 runs at once (about 210,000 tokens), then one more every 15 seconds. The rate cannot be lower than 1 a minute and cannot fund the budget on
      # its own: past about 8 to 12 cases an hour the class (the real stop) makes the gateway refuse runs with 429, and those end TASK_STATE_FAILED. The sender then asks again only up to 3 attempts.
      # maxInFlight 2: a call is over in under a second (the gate returns at once), so two open calls at the gate are plenty and bound what a stuck sender can hold.
      - name: kestrel-fault-events
        serviceAccount: {namespace: kestrel-records, name: records-events}
        agents: [service-agent]
        event:
          text: 'Work case SVC-[0-9]{4}-[0-9]{4}'
          rate: {perMinute: 4, burst: 3}
          maxInFlight: 2

# The records pod may reach the gate: its pods are admitted to the gate's ingress on 8080 (the gate then asks for the token and the rule above).
networkPolicy:
  extraA2ACallers:
    - {namespace: kestrel-records, podLabels: {app: records}}
