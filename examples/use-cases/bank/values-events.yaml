# The event caller of the bank use case (ADR 0027, slices 5 and 6). Composed ONLY when install.sh runs with EVENTS=1: without it the gate carries no rule for the
# records service and admits none of its pods, and the platform values are exactly what they were before the sender existed. It is the same file for the quick
# start path (values.yaml) and the full demo path (values-full-demo.yaml). Another use case's file is listed in ALSO_COMPOSE next to its values-full-demo.yaml
# (examples/use-cases/bank/README.md, "Event triggers").
governance:
  a2a:
    callers:
      # The records service as an EVENT CALLER (ADR 0027): a dispute that its intake route (POST /cases) accepts opens a case and starts the dispute agent with
      # one short text, "Work case DSP-2026-0042", and nothing else. The ServiceAccount records-events is the pod's own (manifests/records.yaml). The customer's
      # words stay in the record, where the agent reads them as untrusted fields. Chart agents only: dispute-agent has no long-term memory, as an event caller requires.
      # The numbers come from the measured runs (README, "Event triggers"): a case takes 25 to 50 seconds and about 100,000 to 180,000 tokens, and the budget class
      # bank-case-agent lets the key of the agent use 800,000 tokens an hour (values.yaml). A burst of 2 starts at most 2 runs at once (at most 360,000 tokens), then one more every 30 seconds, so a ring of five filings is
      # submitted in about 90 seconds. The rate cannot be lower than 1 a minute and cannot fund the budget on its own: about 4 to 8 cases an hour use it up, and past
      # that the gateway refuses runs (429, the class bank-case-agent is the real stop; the task ends TASK_STATE_FAILED); the sender asks again up to 3 attempts and no more. maxInFlight 2: a call is over in under a second.
      - name: fernvale-case-events
        serviceAccount: {namespace: fernvale-records, name: records-events}
        agents: [dispute-agent]
        event:
          text: 'Work case DSP-[0-9]{4}-[0-9]{4}'
          rate: {perMinute: 2, burst: 2}
          maxInFlight: 2

# The records pod may reach the gate: its pods are admitted to the gate's ingress on 8080 (the gate then asks for the token and the rule above).
networkPolicy:
  extraA2ACallers:
    - {namespace: fernvale-records, podLabels: {app: records}}
