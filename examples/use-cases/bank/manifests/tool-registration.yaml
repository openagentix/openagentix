# Registers the records service as one more backend of the tool group, the same way the chart registers the knowledge base: an
# MCPServerEntry creates no pod, the vMCP connects to the URL itself. `unauthenticated` must be stated, because with
# outgoingAuth.source=discovered an entry without an auth reference is dropped. Applied by install.sh. Names and namespace
# match the chart defaults (mcp.namespace mcp-tools, mcp.groupName tools).
#
# The agent sees these tools as records_<tool> on the shared vMCP. A tool PROFILE for them is not possible yet: the chart only lets a profile
# name backends of mcp.servers, the knowledge base and notify. See README, "What could not be wired".
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: records-noauth
  namespace: mcp-tools
  labels: {app.kubernetes.io/part-of: openagentix-use-case-bank}
spec:
  type: unauthenticated
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: records
  namespace: mcp-tools
  labels: {app.kubernetes.io/part-of: openagentix-use-case-bank}
spec:
  groupRef: {name: tools}
  remoteUrl: http://records.fernvale-records.svc.cluster.local:8080/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  externalAuthConfigRef: {name: records-noauth}
