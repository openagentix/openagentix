# The records service (system of record of the bank use case) in its own namespace. Applied by examples/use-cases/bank/install.sh,
# not by the chart. The synthetic data is seeded at start into an emptyDir, so deleting the pod resets it.
#
# - MCP on 8080 (the port the tool gateway reaches). REST on 127.0.0.1:8081 inside the pod: only `kubectl port-forward` reaches it.
# - The MCP port needs a credential: the whole Authorization header value, read per request from the file
#   /etc/records-mcp/value (Secret `records-mcp-expected`, key `value`). The tool gateway sends the same value from the Secret
#   `records-mcp-auth` in the tools namespace (mcp.endpoints, ADR 0026). Without the file the service does not start.
# - The approvers Secret `records-approvers` (key approvers.json, SHA-256 hashes of approver tokens, never the tokens) is created by
#   install.sh from generated values. It is not in this file. Without it the pod cannot start, so nobody can approve by accident.
# - Both Secrets and this namespace come BEFORE the platform values: the chart renders a NetworkPolicy into this namespace.
# - IMAGE_PLACEHOLDER is replaced by install.sh with the image it built.
apiVersion: v1
kind: Namespace
metadata:
  name: fernvale-records
  labels:
    app.kubernetes.io/part-of: openagentix-use-case-bank
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  #EVENTS-OFF-BEGIN
  name: records
  #EVENTS-OFF-END
  #EVENTS-ON-BEGIN
  # With the event sender on (install.sh EVENTS=1) the pod runs as its own ServiceAccount records-events: the kubelet projects a short-lived token with the audience of the
  # A2A gate for it, and the gate's caller rule (values-events.yaml) names it. It has no right in the Kubernetes API. install.sh deletes the account of the other form.
  name: records-events
  #EVENTS-ON-END
  namespace: fernvale-records
  labels: {app: records, app.kubernetes.io/part-of: openagentix-use-case-bank}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records
  namespace: fernvale-records
  labels: {app: records, app.kubernetes.io/part-of: openagentix-use-case-bank}
spec:
  replicas: 1
  strategy: {type: Recreate}          # one SQLite file on an emptyDir: never two pods at once
  selector:
    matchLabels: {app: records}
  template:
    metadata:
      labels: {app: records, app.kubernetes.io/part-of: openagentix-use-case-bank}
    spec:
      #EVENTS-OFF-BEGIN
      serviceAccountName: records
      #EVENTS-OFF-END
      #EVENTS-ON-BEGIN
      serviceAccountName: records-events
      #EVENTS-ON-END
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: records
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mcp, containerPort: 8080}
          env:
            - {name: RECORDS_DOMAIN, value: bank}
            - {name: RECORDS_DATA_DIR, value: /data}
            - {name: RECORDS_APPROVERS_FILE, value: /etc/records/approvers.json}
            - {name: RECORDS_MCP_TOKEN_FILE, value: /etc/records-mcp/value}
            #EVENTS-ON-BEGIN
            # The event sender (ADR 0027). It is on only when install.sh ran with EVENTS=1. An intake route (a fault, a service request, a dispute) queues an event
            # in the same transaction as the case, and the sender asks the agent through the gate, as the ServiceAccount records-events, with the token below.
            - {name: RECORDS_EVENT_GATE_URL, value: "http://a2a-gate.openagentix-gateway.svc.cluster.local:8080/agents/kagent/dispute-agent"}
            - {name: RECORDS_EVENT_TOKEN_FILE, value: /var/run/records-events/token}
            #EVENTS-ON-END
            # RECORDS_REST_ADDR is not set: REST stays on 127.0.0.1:8081 (the default).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: approvers, mountPath: /etc/records, readOnly: true}
            - {name: mcp-credential, mountPath: /etc/records-mcp, readOnly: true}
            #EVENTS-ON-BEGIN
            - {name: gate-token, mountPath: /var/run/records-events, readOnly: true}
            #EVENTS-ON-END
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: approvers
          secret:
            secretName: records-approvers
            defaultMode: 0440
            items:
              - {key: approvers.json, path: approvers.json}
        - name: mcp-credential
          secret:
            secretName: records-mcp-expected
            defaultMode: 0440
            items:
              - {key: value, path: value}
        #EVENTS-ON-BEGIN
        # A token for the A2A gate and nothing else: the audience is the gate's, it lives 10 minutes (a captured request can be replayed only while it lives), and the
        # kubelet renews the file; the sender reads it for every request.
        - name: gate-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {audience: openagentix-a2a, expirationSeconds: 600, path: token}
        #EVENTS-ON-END
---
apiVersion: v1
kind: Service
metadata:
  name: records
  namespace: fernvale-records
  labels: {app: records, app.kubernetes.io/part-of: openagentix-use-case-bank}
spec:
  selector: {app: records}
  ports:
    - {name: mcp, port: 8080, targetPort: mcp}
---
# The base policy: the records pod accepts no connection and makes none (no egress rule, DNS included). Policies add up, so the one
# path in is the policy `openagentix-endpoint-records` that the platform chart renders into this namespace (mcp.endpoints, ADR 0026): it
# admits the tool server of the group `disputes` on 8080 and nothing else. Until the platform is installed there is no path in at all.
# This limits who can reach the port ONLY on a network plugin that enforces NetworkPolicy. The live job (hack/ci/bank-live.sh) saw ingress
# enforced on kind in CI, and in-cluster egress enforced for the tool server labels in one run; egress to the internet is not shown (README).
# The header credential is the second check. Kubelet probes come from the node and are
# not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: records
  namespace: fernvale-records
  labels: {app: records, app.kubernetes.io/part-of: openagentix-use-case-bank}
spec:
  podSelector:
    matchLabels: {app: records}
  policyTypes: [Ingress, Egress]
  ingress: []
  #EVENTS-OFF-BEGIN
  egress: []
  #EVENTS-OFF-END
  #EVENTS-ON-BEGIN
  # With the event sender on (ADR 0027) the pod may reach DNS and the A2A gate, and nothing else: no other pod, no Kubernetes API, no internet.
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openagentix-gateway}}
          podSelector: {matchLabels: {app: a2a-gate}}
      ports:
        - {protocol: TCP, port: 8080}
  #EVENTS-ON-END
