version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # One entry per Go module (dependabot does not discover them). Add a block when a new module is added.
  - package-ecosystem: gomod
    directories:
      - /services/a2a-gate
      - /services/control-plane
      - /services/kb
      - /services/notify
      - /bridges/telegram
      - /tools/a2a-call
      - /services/console
      - /hack/ci/guardtest
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /console
      - /website
    schedule:
      interval: weekly
    # Held back on purpose: TypeScript 7 lacks the compiler API SvelteKit needs; prettier-plugin-svelte 4 reformats
    # every component; @types/node must follow the Node 22 runtime; layout-elk 1.x conflicts with the peer range
    # of the Docusaurus mermaid theme.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: prettier-plugin-svelte
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@mermaid-js/layout-elk'
        update-types: ['version-update:semver-major']
    groups:
      npm-dependencies:
        patterns: ['*']
