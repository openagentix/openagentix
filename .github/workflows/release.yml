name: release

# A release is a tag `vX.Y.Z` (or `vX.Y.Z-rc.1`) on a commit of main. The tag push runs this workflow: it checks the tag and
# the changelog, runs the same checks as ci.yml, builds and pushes one image per service to ghcr.io/openagentix/<name>,
# packages the Helm chart and pushes it as an OCI artifact, and creates the GitHub release with the CHANGELOG section
# plus the image digests as its body. Steps and limits: docs/contributing/workflow.md and hack/ci/README.md.
#
# Signing (issue #7, ADR 0018): every pushed image and the OCI chart is signed with keyless cosign (the job's GitHub
# OIDC identity, Sigstore's public Fulcio and Rekor). Each image gets an SPDX SBOM (syft), attached as a cosign
# attestation and published as a release asset. Each image and the chart get a SLSA build provenance attestation
# (actions/attest-build-provenance). The release assets are listed in SHA256SUMS, which is signed (cosign sign-blob)
# and attested. The release job runs hack/verify-release.sh on all of it before it creates the release, so a release
# without a signature, an SBOM or provenance fails. How to verify: docs/diary/guide/verify-release.md.
#
# Dry run: start it by hand (Actions > release > Run workflow) on any branch. A manual run never pushes an image or a
# chart, never signs and never creates a release. It builds everything, makes the SBOMs from the local images and the
# checksums file, and prints what would be signed, the verify commands and the release body in the job summary.
# `version` only picks which changelog section to check (it must have one).
#
# Secrets: only the automatic GITHUB_TOKEN. Each job asks for the least it needs: `packages: write` only in the two
# jobs that push; `id-token: write` and `attestations: write` only in the three jobs that sign (images, chart,
# assets); `contents: write` only in the job that creates the release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run, with the v (its section must exist in CHANGELOG.md)'
        required: true
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'
  HELM_VERSION: v3.22.0
  COSIGN_VERSION: v3.1.4
  REGISTRY: ghcr.io/openagentix
  CHART_REPO: oci://ghcr.io/openagentix/charts
  # Real publishing only for a tag push. A manual run is always a dry run.
  PUBLISH: ${{ github.event_name == 'push' && 'true' || 'false' }}

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          # fails when the tag is not a semantic version or CHANGELOG.md has no section for it
          hack/release-notes.sh "$TAG" CHANGELOG.md > section.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "${TAG#v}" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "changelog section for $TAG:"; cat section.md
      - name: the tag is on main and this is the project repository
        if: env.PUBLISH == 'true'
        run: |
          [ "$GITHUB_REPOSITORY" = "openagentix/openagentix" ] || { echo "::error::releases are made from openagentix/openagentix only"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: release tests (the script that reads the changelog, the verify script)
        run: |
          hack/ci/release-notes-test.sh
          hack/ci/verify-release-test.sh
      - id: matrix
        # Service and tool images only. The samples under examples/ are built by ci.yml and are not released.
        run: |
          echo "image_matrix=$(hack/ci/dockerfiles.sh --json | jq -c '.include |= map(select(.dir | startswith("examples/") | not))')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------------------------
  checks:
    # The same jobs as a pull request (go, chart, shell, integration, images, guard, apiserver, console, ...).
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------------------------------------------
  images:
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # push the image, its signature and its attestations
      id-token: write       # keyless signing: the OIDC token that Fulcio turns into a short-lived certificate
      attestations: write   # store the build provenance attestation with GitHub
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.verify.outputs.image_matrix) }}
    name: image (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # the tools in the signed build path are pinned: buildx by version, BuildKit by digest
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: install syft (pinned, checked by SHA-256)
        run: |
          hack/ci/install-tools.sh syft
          "$HOME/.local/bin/syft" version | grep -E '^Version:'
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # linux/amd64 only: the Dockerfiles compile under the target platform, so arm64 would run the Go build under
          # QEMU. Not covered yet (hack/ci/README.md).
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          # a dry run loads the image into the runner's Docker, so the SBOM step scans the real build
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ needs.verify.outputs.version }}
          # BUILDKIT_SYNTAX replaces the floating `# syntax=docker/dockerfile:1` line of the Dockerfiles with a digest
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILDKIT_SYNTAX=docker/dockerfile:1.29.0@sha256:572cebbc2b15e6f84c077742952674889cb63cd5e9b80abdffcbe587b6f19183
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          # One plain image manifest, so the digest is the one to pull. The SBOM and the provenance are made by the
          # steps below and attached to that digest, not put in an image index by buildx.
          provenance: false
          sbom: false
          # A signed image is built clean: no layer cache, because ordinary CI runs can write the cache.
          no-cache: true
      - name: SBOM (SPDX JSON, syft)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p sbom
          out="sbom/sbom-$NAME-$VERSION.spdx.json"
          if [ "$PUBLISH" = true ]; then src="registry:$REGISTRY/$NAME@$DIGEST"; else src="docker:$REGISTRY/$NAME:$VERSION"; fi
          "$HOME/.local/bin/syft" scan "$src" --quiet -o "spdx-json=$out"
          jq -e '.spdxVersion and (.packages | length > 0)' "$out" > /dev/null || { echo "::error::empty SBOM for $NAME"; exit 1; }
          echo "SBOM for $NAME from $src: $(jq '.packages | length' "$out") packages, $(jq -r .spdxVersion "$out")"
      - name: SBOM of the console web app (npm packages from the lockfile; syft cannot see them in the Go binary)
        if: matrix.name == 'console'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          out="sbom/sbom-console-web-$VERSION.spdx.json"
          "$HOME/.local/bin/syft" scan file:console/pnpm-lock.yaml --quiet -o "spdx-json=$out"
          jq -e '.packages | length > 0' "$out" > /dev/null || { echo "::error::empty SBOM for the console lockfile"; exit 1; }
          echo "SBOM of console/pnpm-lock.yaml: $(jq '.packages | length' "$out") packages (a release file, not attached to the image)"
      - name: sign the image and attach the SBOM (keyless cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ref="$REGISTRY/$NAME@$DIGEST"
          sbom="sbom/sbom-$NAME-$VERSION.spdx.json"
          if [ "$PUBLISH" = true ]; then
            case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest for $NAME"; exit 1 ;; esac
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$ref"
            echo "signed $ref and attached its SBOM"
          else
            { echo "dry run, $NAME: would sign \`$REGISTRY/$NAME@<digest after push>\` with keyless cosign, attach"
              echo "\`$(basename "$sbom")\` ($(jq '.packages | length' "$sbom") packages) as an spdxjson attestation, and attest build provenance."
              echo; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: build provenance (SLSA, GitHub attestation, also pushed to the registry)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p digests
          if [ "$PUBLISH" = true ]; then
            case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest for $NAME"; exit 1 ;; esac
            echo "$NAME $DIGEST" > "digests/$NAME.txt"
            echo "pushed $REGISTRY/$NAME@$DIGEST"
          else
            echo "dry run: built $NAME, nothing pushed"
            echo "$NAME sha256:$(printf '%064d' 0)" > "digests/$NAME.txt"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------------------------
  chart:
    needs: [verify, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write       # push the chart and its signature
      id-token: write       # keyless signing
      attestations: write   # build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        # cosign reads the Docker credentials, not helm's
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: package with version and appVersion from the tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          helm lint charts/openagentix
          helm package charts/openagentix --version "$VERSION" --app-version "$VERSION" --destination dist
          ls -l dist
          # the packaged chart renders with its default values
          helm template openagentix "dist/openagentix-$VERSION.tgz" > /dev/null
          helm show chart "dist/openagentix-$VERSION.tgz" | grep -E '^(version|appVersion):'
      - name: push to ghcr.io (OCI)
        id: push
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/openagentix-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt | tail -1)
          case "$digest" in sha256:*) ;; *) echo "::error::helm push printed no digest"; exit 1 ;; esac
          echo "pushed $CHART_REPO/openagentix:$VERSION ($digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign the chart (keyless cosign)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p out
          ref="${CHART_REPO#oci://}/openagentix"
          if [ "$PUBLISH" = true ]; then
            cosign sign --yes "$ref@$DIGEST"
            echo "signed $ref@$DIGEST"
            echo "$DIGEST" > out/chart-digest.txt
          else
            { echo "dry run, chart: would sign \`$ref@<digest after push>\` with keyless cosign and attest build provenance."
              echo "The package \`openagentix-$VERSION.tgz\` has sha256 \`$(sha256sum "dist/openagentix-$VERSION.tgz" | cut -d' ' -f1)\`."
              echo; } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "sha256:$(printf '%064d' 0)" > out/chart-digest.txt
          fi
      - name: build provenance of the OCI chart
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openagentix/charts/openagentix
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-digest
          path: out/chart-digest.txt
          retention-days: 7

  # ---------------------------------------------------------------------------------------------------------------
  assets:
    # The files attached to the release: the chart package, one SBOM per image and the image digest list, plus
    # SHA256SUMS over all of them. SHA256SUMS is signed (a Sigstore bundle next to it), and every file it lists gets a
    # build provenance attestation.
    needs: [verify, images, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # keyless signing of SHA256SUMS
      attestations: write   # build provenance for each release asset
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: collected
          merge-multiple: true
      - name: SHA256SUMS over the release assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MATRIX: ${{ needs.verify.outputs.image_matrix }}
        run: |
          want=$(echo "$MATRIX" | jq '.include | length')
          # one SBOM per image, plus the console web app's lockfile SBOM
          [ "$(find assets -name 'sbom-*.spdx.json' ! -name 'sbom-console-web-*' | wc -l)" -eq "$want" ] || { echo "::error::SBOM count does not match the image matrix"; exit 1; }
          [ -f "assets/openagentix-$VERSION.tgz" ] || { echo "::error::no chart package"; exit 1; }
          cat collected/*.txt | sort > "assets/image-digests-$VERSION.txt"
          (cd assets && sha256sum -- * > SHA256SUMS)
          { echo "### Release assets"; echo; echo '```'; cat assets/SHA256SUMS; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: sign SHA256SUMS (keyless cosign, Sigstore bundle)
        run: |
          if [ "$PUBLISH" = true ]; then
            cosign sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
          else
            echo "dry run: would sign SHA256SUMS (bundle SHA256SUMS.sigstore.json) and attest build provenance for each file in it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: build provenance of every release asset
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------------------------
  release:
    needs: [verify, images, chart, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write           # creates the release; nothing else here needs more than read
      packages: read            # the gate reads the images, the chart and their signatures
      attestations: read        # the gate reads the provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: collected
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-digest
          path: collected-chart
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        # read only: new packages on ghcr.io can be private until a maintainer makes them public
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release body = changelog section + image digests
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          MATRIX: ${{ needs.verify.outputs.image_matrix }}
        run: |
          cat collected/*.txt | sort > digests.txt
          [ "$(wc -l < digests.txt)" -eq "$(echo "$MATRIX" | jq '.include | length')" ] \
            || { echo "::error::digest count does not match the image matrix"; exit 1; }
          hack/release-notes.sh "$TAG" CHANGELOG.md --digests digests.txt \
            --registry "$REGISTRY" --chart "$CHART_REPO/openagentix" > body.md
          { echo; echo "Signatures, SBOMs and provenance: [how to verify a release](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/diary/guide/verify-release.md)."; } >> body.md
          { echo "### Release body for $TAG"; [ "$PUBLISH" = true ] || echo "(dry run: digests are zeros, nothing was pushed)"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: gate - every image and the chart are signed and attested, SHA256SUMS is signed, every release file is attested
        # A release without a signature, an SBOM or provenance stops here, before the release exists.
        # A dry run prints the commands instead (hack/verify-release.sh --dry-run).
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode=(); [ "$PUBLISH" = true ] || mode=(--dry-run)
          refs=(); while read -r name digest; do refs+=("$REGISTRY/$name@$digest"); done < digests.txt
          chart="${CHART_REPO#oci://}/openagentix@$(cat collected-chart/chart-digest.txt)"
          # no pipe here: the default shell has no pipefail, and a pipe would hide a failed check
          rc=0
          {
            hack/verify-release.sh "${mode[@]}" --tag "$TAG" "${refs[@]}" || rc=1
            hack/verify-release.sh "${mode[@]}" --tag "$TAG" --no-sbom "$chart" || rc=1
            hack/verify-release.sh "${mode[@]}" --tag "$TAG" --checksums assets/SHA256SUMS || rc=1
          } > verify.txt 2>&1
          cat verify.txt
          { echo "### Verification"; echo; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || { echo "::error::an artefact is not signed or attested; the release is not created"; exit 1; }
      - name: create the GitHub release, with the SBOMs, the chart package and the signed SHA256SUMS
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=""; [ "$PRERELEASE" = true ] && flags="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file body.md $flags assets/*
