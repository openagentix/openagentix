name: dco

# Developer Certificate of Origin check. Every commit in a pull request needs a "Signed-off-by" line whose address
# matches the commit's author. See CONTRIBUTING.md and docs/contributing/workflow.md.
# Plain shell over `git log`; no third-party action except checkout (pinned by commit SHA).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # Rule (hack/ci/dco-check.sh): a commit passes with a matching Signed-off-by; a merge commit and a bot commit pass;
        # a squash merge made by GitHub (committer noreply@github.com) passes only when its title ends in "(#N)" for a pull
        # request of this repository that was merged AS this commit and whose own commits are all signed off (read-only API,
        # default token). If that cannot be verified, the check fails.
        run: hack/ci/dco-check.sh "$BASE" "$HEAD"
