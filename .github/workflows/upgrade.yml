name: upgrade

# Upgrade from the last release to this checkout (issue #205): a kind cluster on a hosted runner, the tag v0.2.0 installed with ITS OWN installer
# (no image of it is published), state seeded, then this checkout's ./install.sh with the same values, then once more with the control plane on
# (the CRD is new). hack/ci/upgrade-test.sh checks the state is kept. Placeholder keys only: no paid model is called.
# NOT part of the required `ci-ok` gate; run it before each release (workflow_dispatch), see hack/ci/README.md.
on:
  pull_request:
    paths:
      - install.sh
      - uninstall.sh
      - charts/**
      - hack/ci/upgrade-test.sh
      - .github/workflows/upgrade.yml
  schedule:
    - cron: '47 5 * * *'   # nightly
  workflow_dispatch:
    inputs:
      from:
        description: 'tag to upgrade from'
        default: v0.2.0

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: upgrade (v0.2.0 to this checkout)
    runs-on: ubuntu-24.04          # 4 vCPU / 16 GB for public repositories
    timeout-minutes: 90
    env:
      UPGRADE_FROM: ${{ github.event.inputs.from || 'v0.2.0' }}
      AGENT_WAIT: 600s
      UPGRADE_LOG_DIR: ${{ github.workspace }}/upgrade-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the release tag
        run: git fetch --no-tags --depth=1 origin "refs/tags/${UPGRADE_FROM}:refs/tags/${UPGRADE_FROM}"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: upgrade test
        run: |
          set -o pipefail
          mkdir -p "$UPGRADE_LOG_DIR"
          hack/ci/upgrade-test.sh 2>&1 | tee upgrade.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Upgrade from ${UPGRADE_FROM} to this checkout"
            echo '```'
            grep -E '^(#|ok|FAIL|upgrade:|      )' upgrade.log 2>/dev/null | grep -v '^      |' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl get agents.api.kagent.dev,agentdefinitions.openagentix.io -A -o yaml | head -200 || true
          helm list -A || true
          helm history openagentix -n openagentix-system || true
          kubectl logs -n kagent deploy/kagent-controller --tail=80 || true
          kubectl logs -n openagentix-system deploy/openagentix-control-plane --tail=60 || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-logs
          path: |
            upgrade-logs
            kind-logs
          retention-days: 7
