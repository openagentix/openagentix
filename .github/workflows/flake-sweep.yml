name: flake-sweep

# Nightly flake sweep (issue #194): every Go module's tests run 20 times with the race detector, one module per job, so a flaky test is
# found before it turns main red. It never runs on a pull request and is not part of `ci-ok`: a red run is a report. The job summary
# lists each failing test and how many of the runs failed. Local: `make flake-sweep` (see hack/ci/README.md).
on:
  schedule:
    - cron: '23 2 * * *'   # nightly, before e2e (03:17) and e2e-k3s (03:47)
  workflow_dispatch:
    inputs:
      count:
        description: Runs of every test (go test -count)
        default: '20'
        required: false

permissions:
  contents: read

concurrency:
  group: flake-sweep-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go_matrix: ${{ steps.matrix.outputs.go_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "go_matrix=$(hack/ci/go-modules.sh --json)" >> "$GITHUB_OUTPUT"

  sweep:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60            # one module, 20 runs of its tests with -race (one run takes 1-3 minutes in ci)
    strategy:
      fail-fast: false             # a failing module must not hide the others
      matrix: ${{ fromJSON(needs.matrix.outputs.go_matrix) }}
    name: sweep (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.sum }}
      # a few tests shell out to yq (the Python wrapper) and would otherwise skip
      - run: hack/ci/install-tools.sh yq
      - name: go test -race -count=N, failing tests listed in the job summary
        env:
          COUNT: ${{ inputs.count || '20' }}
          MODULE: ${{ matrix.dir }}
        run: hack/ci/flake-sweep.sh "$MODULE" --count "$COUNT" --summary "$GITHUB_STEP_SUMMARY"
