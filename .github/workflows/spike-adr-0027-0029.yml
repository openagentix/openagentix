name: spike-adr-0027-0029

# Two design spikes (issue #229): the model gateway behind ADR 0029 (budget classes, PR #262) and the runtime behind the A2A gate for ADR 0027
# (event triggers, PR #260). A throwaway kind cluster on a hosted runner, the quick start (the stub model, no key, no chat token), then
# hack/spikes/adr-spikes.sh. The results go to the job summary and to the artifact. DISPATCH ONLY: it never runs on a pull request and never
# gates a merge. Start it by hand: Actions, spike-adr-0027-0029, Run workflow, on this branch.
on:
  workflow_dispatch:
    inputs:
      spikes:
        description: 'Which spike: a (ADR 0029, the model gateway), b (ADR 0027, the runtime behind the gate) or both'
        type: choice
        options: [both, a, b]
        default: both

permissions:
  contents: read

concurrency:
  group: spike-adr-0027-0029-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart, no key, no token)
        env:
          PROFILE: quickstart
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: spikes
        env:
          SPIKES: ${{ inputs.spikes }}
          SPIKE_OUT: ${{ github.workspace }}/spike-out
        run: |
          set -o pipefail
          hack/spikes/adr-spikes.sh 2>&1 | tee spike.log
      - name: diagnostics
        if: always()
        run: |
          mkdir -p spike-out
          kubectl get pods -A -o wide > spike-out/pods.txt 2>&1 || true
          kubectl get agentgatewaypolicy -n agentgateway-system -o yaml > spike-out/gateway-policy.yaml 2>&1 || true
          tail -150 spike.log > spike-out/spike-tail.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-adr-0027-0029
          path: |
            spike-out/
            spike.log
            install.log
          if-no-files-found: ignore
          retention-days: 30
