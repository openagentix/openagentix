name: e2e

# Keyless end-to-end install (ADR 0014, issue #34): a kind cluster on a hosted runner, `PROFILE=quickstart ./install.sh` with NO key and NO
# chat token (the built-in stub model), then hack/ci/smoke.sh. It writes the time to the first working agent to the job summary.
# NOT part of the required `ci-ok` gate until it has passed reliably; see hack/ci/README.md for its record and for what it proves.
on:
  pull_request:
    paths:
      - install.sh
      - uninstall.sh
      - hack/netpol-check.sh
      - hack/release-values-diff.sh
      - hack/release-values-ignore.txt
      - charts/**
      - components/**
      - services/**
      - console/**
      - hack/ci/smoke.sh
      - hack/ci/msgid-scope.sh
      - hack/ci/events-live.sh
      - hack/ci/event-live.sh
      - hack/ci/event_live.py
      - hack/ci/event-recorder.py
      - hack/ci/event-ci-values.yaml
      - hack/ci/diagnostics-live.sh
      - hack/ci/diagnostics-ci-values.yaml
      - hack/ci/rca-live.sh
      - hack/ci/rca-audit-tools.jq
      - examples/use-cases/software-org/**
      - hack/ci/endpoints-live.sh
      - hack/ci/endpoints-ci-setup.sh
      - hack/ci/endpoints-ci-values.yaml
      - hack/ci/endpoints-ci/**
      - hack/ci/bank-live.sh
      - hack/ci/bank-audit-tools.jq
      - examples/use-cases/bank/**
      - examples/use-cases/records/**
      - hack/ci/equipment-live.sh
      - hack/ci/equipment-audit-tools.jq
      - examples/use-cases/equipment/**
      - hack/ci/phases.sh
      - hack/demo.sh
      - hack/ask.sh
      - hack/kind-config.yaml
      - .github/workflows/e2e.yml
  schedule:
    - cron: '17 3 * * *'   # nightly
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Run the live check of cluster-read (ADR 0025, slice 4) instead of the profiles: the quick start plus hack/ci/diagnostics-ci-values.yaml'
        type: boolean
        default: false
      endpoints:
        description: 'Run the live check of mcp.endpoints (ADR 0026, slice 2) instead of the profiles: two tiny endpoints, then the quick start plus hack/ci/endpoints-ci-values.yaml'
        type: boolean
        default: false
      equipment:
        description: 'Run the live proof of the equipment use case on mcp.endpoints (ADR 0026, issue #229) instead of the profiles: the quick start plus the use case, the stub model with its scenarios, real agent sessions through the A2A gate, tools/oa-eval, the events and the approver path'
        type: boolean
        default: false
      equipment_with_bank:
        description: 'Like equipment, but the bank use case is installed first and the equipment install finds it in the release and composes it, so the isolation of the two tool sets is checked in both directions'
        type: boolean
        default: false
      bank:
        description: 'Run the live proof of the bank use case on mcp.endpoints (ADR 0026, slice 5, issue #229) instead of the profiles: the quick start plus the use case, the stub model with its scenarios, real agent sessions through the A2A gate, tools/oa-eval, the approver path'
        type: boolean
        default: false
      budget_classes:
        description: 'Run the live proof of budget classes (ADR 0029, slice 3, issue #229) instead of the profiles: the quick start plus hack/ci/budget-classes-ci-values.yaml (two classes, three chart agents), the stub model behind a recording stand-in'
        type: boolean
        default: false
      rca:
        description: 'Run the live proof of the pod root-cause agent (examples/use-cases/software-org, issue #229) instead of the profiles: the quick start plus the use case, the stub model with its scenarios, a real agent session through the A2A gate, tools/oa-eval'
        type: boolean
        default: false
      event_triggers:
        description: 'Run the live proof of event callers (ADR 0027, issue #229) instead of the profiles: the quick start plus hack/ci/event-ci-values.yaml, the stub model, a recording stand-in between the A2A gate and the runtime'
        type: boolean
        default: false
      adr_spikes:
        description: 'Run the design spikes of ADR 0029 (a, the model gateway) and ADR 0027 (b, the runtime behind the A2A gate), or both (issue #229, hack/spikes/adr-spikes.sh) instead of the profiles. It observes a throwaway cluster and never gates a merge'
        type: choice
        options: [none, both, a, b]
        default: none
      adr0031:
        description: 'Run the design spike of ADR 0031 (tool servers that cannot read Secrets, issue #229, hack/spikes/adr0031_tool_server_spike.py) instead of the profiles: the endpoints cluster of the endpoints job, then the spike. It observes a throwaway cluster and never gates a merge'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.profile }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.diagnostics && !inputs.endpoints && !inputs.bank && !inputs.rca && !inputs.equipment && !inputs.equipment_with_bank && !inputs.budget_classes && !inputs.event_triggers && inputs.adr_spikes == 'none' && !inputs.adr0031) }}
    runs-on: ubuntu-24.04          # 4 vCPU / 16 GB for public repositories
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: quickstart    # the quick start, with the sample container agent: the same set as the runs before issue #29
            byo: "1"
            console: "1"
          - profile: minimal       # issue #29: no console, no observability, no sample container agent
            byo: "0"
            console: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: runner resources before the install
        run: |
          nproc; free -m | head -2; df -h / | tail -1
          ls -l /dev/kvm 2>&1 || true
          uname -r
      - name: install (PROFILE=${{ matrix.profile }}, no key, no token)
        id: install
        env:
          PROFILE: ${{ matrix.profile }}
          QUICKSTART_BYO: ${{ matrix.byo }}   # 1: also the sample container agent (bring your own agent, ADR 0015)
          AGENT_WAIT: 300s
          CHECK_NETPOL: ${{ matrix.profile == 'quickstart' && '1' || '0' }}   # issue #212: prints PASS, FAIL or INCONCLUSIVE for NetworkPolicy; not required here (kind's default plugin may not enforce it)
        run: |
          set -o pipefail
          start=$(date +%s)
          ./install.sh 2>&1 | tee install.log
          echo "install_start=$start" >> "$GITHUB_OUTPUT"
          echo "install_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: smoke test
        id: smoke
        env:
          SMOKE_BYO: ${{ matrix.byo }}
          SMOKE_CONSOLE: ${{ matrix.console }}   # 0: the profile has no console, so the console check is skipped
        run: |
          set -o pipefail
          start=$(date +%s)
          hack/ci/smoke.sh 2>&1 | tee smoke.log
          echo "smoke_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: message id scope of the runtime (ADR 0027, per user id; a repeat with returnImmediately)
        run: |
          set -o pipefail
          hack/ci/msgid-scope.sh 2>&1 | tee msgid-scope.log
      - name: demo walkthrough (hack/demo.sh)
        id: demo
        env:
          DEMO_CONSOLE: ${{ matrix.console }}   # 0: the profile has no console, so the console step is skipped
        run: |
          set -o pipefail
          hack/demo.sh 2>&1 | tee demo.log
      - name: node-settings manifest validates (dry run only, not applied; issue #163)
        run: kubectl apply --dry-run=client --validate=strict -f components/runtime/node-settings.yaml
      - name: runner resources after the install
        if: always()
        run: |
          free -m | head -2
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' || true
          uptime
      - name: phases (time to first working agent, issue #35)
        if: always()
        env:
          INSTALL_START: ${{ steps.install.outputs.install_start }}
        run: |
          if [ -n "${INSTALL_START:-}" ] && [ -f install.log ]; then
            hack/ci/phases.sh --install-log install.log --smoke-log smoke.log --install-start "$INSTALL_START" --json phases.json --title "Time to first working agent (phases), PROFILE=${{ matrix.profile }}" > phases.md || true
            cat phases.md phases.json 2>/dev/null || true
          fi
      - name: job summary (time to first working agent)
        if: always()
        env:
          INSTALL_S: ${{ steps.install.outputs.install_seconds }}
          SMOKE_S: ${{ steps.smoke.outputs.smoke_seconds }}
          INSTALL_START: ${{ steps.install.outputs.install_start }}
        run: |
          {
            if [ -f phases.md ]; then cat phases.md; echo '```json'; cat phases.json; echo '```'; echo; fi
            echo "## PROFILE=${{ matrix.profile }}, keyless (stub model)"
            echo
            echo "- time from \`./install.sh\` start to the agent Ready and the summary: **${INSTALL_S:-n/a} s** (cold runner: nothing cached)"
            echo "- smoke test (question through the gate, refused tool, refused definition, console API): ${SMOKE_S:-n/a} s"
            echo "- runner: $(nproc) vCPU, $(free -m | awk '/Mem:/{print $2}') MB"
            echo
            if grep -q '^NetworkPolicy check' install.log 2>/dev/null; then
              echo "### NetworkPolicy check (CHECK_NETPOL=1, issue #212)"
              echo '```'
              grep -A5 '^NetworkPolicy check' install.log
              echo '```'
            fi
            echo "### Where the time goes (install.sh steps)"
            echo '```'
            grep '^=== ' install.log 2>/dev/null || true
            echo '```'
            echo "### Smoke test"
            echo '```'
            cat smoke.log 2>/dev/null || true
            echo '```'
            echo "### Message id scope (ADR 0027)"
            echo '```'
            cat msgid-scope.log 2>/dev/null || true
            echo '```'
            echo "### Demo walkthrough (hack/demo.sh)"
            echo '```'
            cat demo.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl get agent,agentdefinition -A -o yaml | head -150 || true
          kubectl get remotemcpserver -A || true
          kubectl logs -n kagent deploy/kagent-controller --tail=80 || true
          kubectl logs -n openagentix-system deploy/openagentix-control-plane --tail=60 || true
          kubectl get resourcequota -A -o yaml | head -60 || true
          kubectl logs -n kube-system -l component=kube-controller-manager --tail=400 | grep -i quota | tail -20 || true
          echo "--- what the admission guard says about a key Secret"
          hack/ci/guard-probe.sh
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `diagnostics`; DIAGNOSTICS=1 for the script): cluster-read on a real API server. It settles whether the server
  # becomes Ready (its rights check passes with the default discovery rules of a real ServiceAccount, the open question R2 of the code review of ADR 0025
  # slice 3) and what ToolHive loaded for the dedicated profile (the eight tools) and for the shared vMCP (none). See hack/ci/diagnostics-ci-values.yaml.
  e2e-diagnostics:
    name: e2e (diagnostics, cluster-read)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart plus the diagnostics values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/diagnostics-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: live check of cluster-read
        env:
          DIAGNOSTICS: "1"
        run: |
          set -o pipefail
          hack/ci/diagnostics-live.sh 2>&1 | tee diagnostics-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## cluster-read on a real API server (ADR 0025, slice 4)"
            echo '```'
            cat diagnostics-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### install.sh, diagnostics lines"
            echo '```'
            grep -iE 'diagnostics|cluster-read|DiscoveredAuthConfig' install.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- cluster-read (its log holds no secret)"
          kubectl describe pod -n openagentix-diagnostics -l app=cluster-read | tail -60 || true
          kubectl logs -n openagentix-diagnostics deploy/cluster-read --tail=80 || true
          echo "--- the vMCPs and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}]}' || true
          kubectl get remotemcpserver -n kagent -o json | jq -c '.items[]|{name:.metadata.name,tools:[.status.discoveredTools[]?.name]}' || true
          kubectl get validatingadmissionpolicy openagentix-diagnostics-rbac -o json | jq -c '.status' || true
          echo "--- R2: every right the ServiceAccount has, and who grants the ones the rights check calls forbidden"
          kubectl auth can-i --list --as=system:serviceaccount:openagentix-diagnostics:cluster-read -n diag-ci || true
          kubectl auth can-i --list --as=system:serviceaccount:openagentix-diagnostics:cluster-read || true
          kubectl get clusterrole -o json | jq -r '.items[]|select([.rules[]?|(.resources//[])[]]|index("clustertrustbundles"))|"ClusterRole "+.metadata.name' || true
          kubectl get clusterrolebinding -o json | jq -c '.items[]|select(.roleRef.name as $r|["system:cluster-trust-bundles-reader"]|index($r))|{name:.metadata.name,role:.roleRef.name,subjects:.subjects}' || true
          kubectl get clusterrolebinding -o json | jq -c '.items[]|select(any(.subjects[]?;.kind=="Group" and (.name=="system:authenticated" or .name=="system:serviceaccounts")))|{name:.metadata.name,role:.roleRef.name}' || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-diagnostics
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `endpoints`; ENDPOINTS=1 for the scripts): mcp.endpoints on a real cluster (ADR 0026, slice 2). Two tiny MCP endpoints
  # (hack/ci/endpoints-ci/echo-mcp.py) run in their own namespace BEFORE the platform install, as the ADR says; each takes a header value from a Secret. The job
  # settles that a profile vMCP on the group of the endpoints lists exactly its tools through a real tools/list, that the shared vMCP lists none and refuses a call,
  # that the endpoint refuses a wrong header, that no log has the value, that a profile offers tools only (no resource or prompt of a backend it does not list),
  # and records what the vMCP does with `overrides` and with a redirect. See hack/ci/endpoints-ci-values.yaml.
  e2e-endpoints:
    name: e2e (endpoints, mcp.endpoints)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.endpoints }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: cluster, then the endpoints (their namespace and workload come before the platform values)
        env:
          ENDPOINTS: "1"
        run: |
          set -o pipefail
          kind create cluster --name openagentix --config hack/kind-config.yaml
          hack/ci/endpoints-ci-setup.sh 2>&1 | tee setup.log
      - name: install (PROFILE=quickstart plus the endpoints values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/endpoints-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: live check of mcp.endpoints
        env:
          ENDPOINTS: "1"
        run: |
          set -o pipefail
          hack/ci/endpoints-live.sh 2>&1 | tee endpoints-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## mcp.endpoints on a real cluster (ADR 0026, slice 2)"
            echo '```'
            cat endpoints-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### install.sh, endpoint lines"
            echo '```'
            grep -iE 'endpoint|DiscoveredAuthConfig|apiserver|API server' install.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- the endpoints and their pods (their log holds no secret)"
          kubectl get pods,svc,networkpolicy -n endpoint-ci || true
          kubectl logs -n endpoint-ci deploy/echo --tail=60 || true
          echo "--- the vMCPs, the groups, the entries and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}],backends:[.status.discoveredBackends[]?|{name,status}]}' || true
          kubectl get networkpolicy -n mcp-tools -o json | jq -c '.items[]|select(.metadata.name|test("egress"))|{name:.metadata.name,egress:(.spec.egress|length)}' || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-endpoints
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `bank`; BANK_LIVE=1 for the script): the bank use case on mcp.endpoints through REAL agent sessions (ADR 0026, slice 5,
  # issue #229). examples/use-cases/bank/install.sh makes a kind cluster of its own, starts the records service and its Secrets BEFORE the platform values (as
  # the ADR says), installs the quick start with the use case values and the stub model scenarios (no key, no token), and loads the knowledge base. It runs
  # twice, to show that the scenarios stay. hack/ci/bank-live.sh asks the dispute agent about the cases through the A2A gate, runs tools/oa-eval, walks the approver
  # path with ctl.sh, and checks the isolation of the endpoint. The run is scripted by the stub model: it proves the wiring, not a model.
  e2e-bank:
    name: e2e (bank, mcp.endpoints)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bank }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/oa-eval/go.mod
          cache: true
          cache-dependency-path: tools/oa-eval/go.sum
      - run: hack/ci/install-tools.sh yq kind
      - name: install (the records service first, then the quick start plus the bank values, the stub model with the scenarios, no key, no token)
        env:
          CLUSTER: oa-bank-demo
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          examples/use-cases/bank/install.sh 2>&1 | tee install.log
      - name: install again with the same values (the scenarios and the credential stay)
        env:
          CLUSTER: oa-bank-demo
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          examples/use-cases/bank/install.sh 2>&1 | tee install2.log
          grep -q 'Secrets exist' install2.log
          ! grep -q 'created the Secrets' install2.log
      - name: live check of the bank use case
        env:
          BANK_LIVE: "1"
          BANK_OUT: bank-out
          BANK_INSTALL_LOG: install.log
          BANK_INSTALL_LOG2: install2.log
          BANK_LIVE_LOG: bank-live.log
        run: |
          set -o pipefail
          hack/ci/bank-live.sh 2>&1 | tee bank-live.log
      - name: "events, sender off (ADR 0027, with the sender off nothing is sent)"
        env:
          EVENTS_LIVE: "1"
          EVENTS_OUT: events-out
        run: |
          set -o pipefail
          hack/ci/events-live.sh bank off 2>&1 | tee events-off.log
      - name: "turn the sender on (EVENTS=1: the platform values gain the event caller and the namespace admitted to the gate, the records service gets the sender)"
        env:
          CLUSTER: oa-bank-demo
          AGENT_WAIT: 300s
          EVENTS: "1"
        run: |
          set -o pipefail
          examples/use-cases/bank/install.sh 2>&1 | tee install-events.log
      - name: "events, sender on (a real intake event starts the agent with no person, the rate holds a burst, no tool causes an event)"
        env:
          EVENTS_LIVE: "1"
          EVENTS_OUT: events-out
        run: |
          set -o pipefail
          hack/ci/events-live.sh bank on 2>&1 | tee events-on.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Bank use case on mcp.endpoints, real agent sessions (issue #229, ADR 0026 slice 5)"
            echo "The stub model played examples/use-cases/bank/eval/scenario.json: the run is SCRIPTED, not the behaviour of a model."
            echo '```'
            cat bank-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### Event sender (ADR 0027), off then on"
            echo '```'
            cat events-off.log events-on.log 2>/dev/null || echo "the events check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- the records service (its log holds no secret value)"
          kubectl get pods,svc,networkpolicy -n fernvale-records || true
          kubectl logs -n fernvale-records deploy/records --tail=80 | cut -c1-400 || true
          echo "--- the agent and what kagent says about its tool server"
          kubectl get agents.api.kagent.dev dispute-agent -n kagent -o json | jq -c '.status' || true
          kubectl get remotemcpserver -n kagent -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason,message}],tools:[.status.discoveredTools[]?.name]}' || true
          echo "--- the vMCPs, the groups, the entries and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}],backends:[.status.discoveredBackends[]?|{name,status}]}' || true
          kubectl logs -n mcp-tools -l app=virtualmcpserver,toolhive-name=tools-disputes --all-containers --tail=150 | cut -c1-500 || true
          kubectl get networkpolicy -n mcp-tools -o json | jq -c '.items[]|select(.metadata.name|test("egress"))|{name:.metadata.name,egress:(.spec.egress|length)}' || true
          echo "--- kagent, the stub model and the gate"
          kubectl logs -n kagent deploy/kagent-controller --tail=150 | cut -c1-500 || true
          for p in $(kubectl get pods -n kagent -o name 2>/dev/null | grep -v kagent-controller); do echo "--- $p"; kubectl logs -n kagent "$p" --all-containers --tail=60 | cut -c1-500 || true; done
          kubectl logs -n agentgateway-system deploy/stub-model --tail=60 | cut -c1-300 || true
          kubectl logs -n openagentix-gateway -l app=a2a-gate --tail=60 | cut -c1-300 || true
          kind export logs ./kind-logs --name oa-bank-demo || true
      - name: scan the files that are uploaded for the header value and the approver token
        if: always()
        run: |
          # The values are read from the cluster and given to grep through a process substitution: they are never written to a file. A file that holds one is
          # removed from the upload and the job fails. When the values cannot be read, none of the bank files is uploaded (the install logs, the live log,
          # the report and audit file, the cluster logs), because nothing can be scanned.
          LEAK=0
          HV=$(kubectl get secret -n mcp-tools records-mcp-auth -o jsonpath='{.data.value}' 2>/dev/null | base64 -d 2>/dev/null)
          AT=$(kubectl get secret -n fernvale-records records-approver-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null)
          if [ -n "$HV" ] && [ -n "$AT" ]; then
            for f in kind-logs bank-out install.log install2.log bank-live.log install-events.log events-off.log events-on.log events-out; do
              [ -e "$f" ] || continue
              if grep -rlF -f <(printf '%s\n%s\n' "${HV#Bearer }" "$AT") "$f" >/dev/null 2>&1; then
                echo "a secret value is in $f: it is removed from the upload"; rm -rf "$f"; LEAK=1
              fi
            done
          else
            echo "the secret values could not be read from the cluster: none of the bank files is uploaded"; rm -rf kind-logs bank-out install.log install2.log bank-live.log install-events.log events-off.log events-on.log events-out; LEAK=1
          fi
          unset HV AT
          [ "$LEAK" = 0 ]
      - name: upload the report, the audit file and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bank-live
          path: |
            bank-out/report.json
            bank-out/audit.jsonl
            bank-out/eval.out
            bank-live.log
            events-off.log
            events-on.log
            events-out/
            install.log
            install2.log
            install-events.log
            kind-logs
          retention-days: 14
          if-no-files-found: ignore

  # Opt-in (workflow_dispatch with the input `rca`; RCA_LIVE=1 for the script): the pod root-cause agent of the software organisation use case through a REAL
  # agent session (issue #229). examples/use-cases/software-org/install.sh installs the quick start with the use case values and the stub model scenarios (no
  # key, no token), applies the six broken workloads, and hack/ci/rca-live.sh asks the agent about each case through the A2A gate, runs tools/oa-eval, and
  # checks the audit lines and the logs for the planted canaries. It also settles what happens when a chart agent on a diagnostics profile calls a tool (the
  # stub model scenarios decide the calls; the agent runtime, the tool server of the profile, ToolHive and cluster-read do the rest).
  e2e-rca:
    name: e2e (software-org, pod RCA)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rca }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/oa-eval/go.mod
          cache: true
          cache-dependency-path: tools/oa-eval/go.sum
      - run: hack/ci/install-tools.sh yq kind
      - name: install (the quick start plus the software-org values, the stub model with the scenarios, no key, no token)
        env:
          AGENT_WAIT: 300s
          CLUSTER: oa-rca-demo   # the script has no default cluster
        run: |
          set -o pipefail
          examples/use-cases/software-org/install.sh 2>&1 | tee install.log
      - name: live check of the pod root-cause agent
        env:
          RCA_LIVE: "1"
          RCA_OUT: rca-out
        run: |
          set -o pipefail
          hack/ci/rca-live.sh 2>&1 | tee rca-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Pod root-cause agent, a real agent session (software-org use case, issue #229)"
            echo "The stub model played examples/use-cases/software-org/eval/software-org-rca.json: the run is SCRIPTED, not the behaviour of a model."
            echo '```'
            cat rca-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          echo "--- rca-demo: pods and events"
          kubectl get pods -n rca-demo -o wide || true
          kubectl get events -n rca-demo --sort-by=.lastTimestamp | tail -40 || true
          echo "--- the agent and what kagent says about its tool server"
          kubectl get agents.api.kagent.dev pod-rca -n kagent -o json | jq -c '.status' || true
          kubectl get remotemcpserver -n kagent -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason,message}],tools:[.status.discoveredTools[]?.name]}' || true
          echo "--- the vMCPs and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}]}' || true
          echo "--- vMCP tools-rca log (audit data is off: tool names and outcomes only)"
          kubectl logs -n mcp-tools -l app=virtualmcpserver,toolhive-name=tools-rca --all-containers --tail=150 | cut -c1-500 || true
          echo "--- cluster-read log (it holds no secret)"
          kubectl logs -n openagentix-diagnostics deploy/cluster-read --tail=120 | cut -c1-400 || true
          echo "--- kagent: the controller and every other pod of the namespace"
          kubectl logs -n kagent deploy/kagent-controller --tail=150 | cut -c1-500 || true
          for p in $(kubectl get pods -n kagent -o name 2>/dev/null | grep -v kagent-controller); do echo "--- $p"; kubectl logs -n kagent "$p" --all-containers --tail=60 | cut -c1-500 || true; done
          echo "--- the stub model and the gate"
          kubectl logs -n agentgateway-system deploy/stub-model --tail=60 | cut -c1-300 || true
          kubectl logs -n openagentix-gateway -l app=a2a-gate --tail=60 | cut -c1-300 || true
          kind export logs ./kind-logs --name oa-rca-demo || true
      - name: scan what is about to be uploaded for the planted values
        id: planted
        if: always()
        run: hack/ci/rca-upload-scan.sh rca-out rca-live.log install.log --platform-logs kind-logs
      - name: scan what is about to be uploaded for the real values (the cluster-read bearer value, a service account token)
        id: real
        if: always()
        run: |
          # The bearer value is read from the cluster and given to grep through a process substitution: it is never written to a file. The gate token of the
          # live script lives in a shell variable only, and a service account token is a JWT, so the shape of a JWT is searched too. A file that holds one is
          # removed from the upload and the job fails. When the bearer value cannot be read, nothing is uploaded, because nothing can be scanned.
          LEAK=0
          BV=$(kubectl get secret -n openagentix-diagnostics cluster-read-bearer -o jsonpath='{.data.bearer}' 2>/dev/null | base64 -d 2>/dev/null)
          if [ -n "$BV" ]; then
            for f in kind-logs rca-out install.log rca-live.log; do
              [ -e "$f" ] || continue
              if grep -rlIF -f <(printf '%s\n' "$BV") "$f" >/dev/null 2>&1 || grep -rlIE 'eyJ[A-Za-z0-9_-]{15,}[.]eyJ[A-Za-z0-9_-]{15,}[.]' "$f" >/dev/null 2>&1; then
                echo "a real secret value or a token is in $f: it is removed from the upload"; rm -rf "$f"; LEAK=1
              fi
            done
          else
            echo "the bearer value could not be read from the cluster: none of the files is uploaded"; rm -rf kind-logs rca-out install.log rca-live.log; LEAK=1
          fi
          unset BV
          [ "$LEAK" = 0 ]
      - name: upload the report, the audit file and the logs
        if: ${{ always() && steps.planted.outcome == 'success' && steps.real.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rca-live
          path: |
            rca-out/report.json
            rca-out/retry-*.json
            rca-out/audit.jsonl
            rca-out/eval.out
            rca-live.log
            install.log
            kind-logs
          retention-days: 14
          if-no-files-found: ignore

  # Opt-in (workflow_dispatch with the input `equipment` or `equipment_with_bank`; EQUIPMENT_LIVE=1 for the script): the equipment use case on mcp.endpoints through
  # REAL agent sessions (ADR 0026, issue #229). examples/use-cases/equipment/install.sh makes a kind cluster of its own, starts the records service and its Secrets BEFORE
  # the platform values, installs the quick start with the use case values and the stub model scenarios (no key, no token), and loads the knowledge base. It runs twice, to
  # show that the scenarios stay. With `equipment_with_bank` the bank use case is installed first on the same cluster, and the equipment install finds it in the release and composes it.
  # hack/ci/equipment-live.sh asks the service agent about the cases through the A2A gate, runs tools/oa-eval, sends the events and walks the approver path with ctl.sh, and
  # checks the isolation of the endpoint. The run is scripted by the stub model: it proves the wiring, not a model.
  e2e-equipment:
    name: e2e (equipment, mcp.endpoints)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.equipment || inputs.equipment_with_bank) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/oa-eval/go.mod
          cache: true
          cache-dependency-path: tools/oa-eval/go.sum
      - run: hack/ci/install-tools.sh yq kind
      - name: install the bank use case first (only with equipment_with_bank; the equipment install finds it in the release and composes it)
        if: ${{ inputs.equipment_with_bank }}
        env:
          CLUSTER: oa-equipment-demo
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          examples/use-cases/bank/install.sh 2>&1 | tee install-bank.log
      - name: install (the records service first, then the quick start plus the equipment values, the stub model with the scenarios, no key, no token)
        env:
          CLUSTER: oa-equipment-demo
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          examples/use-cases/equipment/install.sh 2>&1 | tee install.log
      - name: install again with the same values (the scenarios and the credential stay)
        env:
          CLUSTER: oa-equipment-demo
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          examples/use-cases/equipment/install.sh 2>&1 | tee install2.log
          grep -q 'Secrets exist' install2.log
          ! grep -q 'created the Secrets' install2.log
      - name: live check of the equipment use case
        env:
          EQUIPMENT_LIVE: "1"
          EQUIPMENT_OUT: equipment-out
          EQUIPMENT_INSTALL_LOG: install.log
          EQUIPMENT_INSTALL_LOG2: install2.log
          EQUIPMENT_LIVE_LOG: equipment-live.log
        run: |
          set -o pipefail
          hack/ci/equipment-live.sh 2>&1 | tee equipment-live.log
      - name: "events, sender off (ADR 0027, with the sender off nothing is sent)"
        env:
          EVENTS_LIVE: "1"
          EVENTS_OUT: events-out
        run: |
          set -o pipefail
          hack/ci/events-live.sh equipment off 2>&1 | tee events-off.log
      - name: "turn the sender on (EVENTS=1: the platform values gain the event caller and the namespace admitted to the gate, the records service gets the sender)"
        env:
          CLUSTER: oa-equipment-demo
          AGENT_WAIT: 300s
          EVENTS: "1"
        run: |
          set -o pipefail
          examples/use-cases/equipment/install.sh 2>&1 | tee install-events.log
      - name: "events, sender on (a real intake event starts the agent with no person, the rate holds a burst, no tool causes an event)"
        env:
          EVENTS_LIVE: "1"
          EVENTS_OUT: events-out
        run: |
          set -o pipefail
          hack/ci/events-live.sh equipment on 2>&1 | tee events-on.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Equipment use case on mcp.endpoints, real agent sessions (issue #229, ADR 0026)"
            echo "The stub model played examples/use-cases/equipment/eval/scenario.json: the run is SCRIPTED, not the behaviour of a model."
            echo '```'
            cat equipment-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### Event sender (ADR 0027), off then on"
            echo '```'
            cat events-off.log events-on.log 2>/dev/null || echo "the events check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- the records service (its log holds no secret value)"
          kubectl get pods,svc,networkpolicy -n kestrel-records || true
          kubectl logs -n kestrel-records deploy/records --tail=80 | cut -c1-400 || true
          echo "--- the agent and what kagent says about its tool server"
          kubectl get agents.api.kagent.dev service-agent -n kagent -o json | jq -c '.status' || true
          kubectl get remotemcpserver -n kagent -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason,message}],tools:[.status.discoveredTools[]?.name]}' || true
          echo "--- the vMCPs, the groups, the entries and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}],backends:[.status.discoveredBackends[]?|{name,status}]}' || true
          kubectl logs -n mcp-tools -l app=virtualmcpserver,toolhive-name=tools-dealer --all-containers --tail=150 | cut -c1-500 || true
          kubectl get networkpolicy -n mcp-tools -o json | jq -c '.items[]|select(.metadata.name|test("egress"))|{name:.metadata.name,egress:(.spec.egress|length)}' || true
          echo "--- kagent, the stub model and the gate"
          kubectl logs -n kagent deploy/kagent-controller --tail=150 | cut -c1-500 || true
          for p in $(kubectl get pods -n kagent -o name 2>/dev/null | grep -v kagent-controller); do echo "--- $p"; kubectl logs -n kagent "$p" --all-containers --tail=60 | cut -c1-500 || true; done
          kubectl logs -n agentgateway-system deploy/stub-model --tail=60 | cut -c1-300 || true
          kubectl logs -n openagentix-gateway -l app=a2a-gate --tail=60 | cut -c1-300 || true
          kind export logs ./kind-logs --name oa-equipment-demo || true
      - name: scan the files that are uploaded for the header value and the approver token
        if: always()
        run: |
          # The values are read from the cluster and given to grep through a process substitution: they are never written to a file. A file that holds one is
          # removed from the upload and the job fails. When the values cannot be read, none of the equipment files is uploaded (the install logs, the live log,
          # the report and audit file, the cluster logs), because nothing can be scanned.
          LEAK=0
          HV=$(kubectl get secret -n mcp-tools dealer-records-mcp-auth -o jsonpath='{.data.value}' 2>/dev/null | base64 -d 2>/dev/null)
          AT=$(kubectl get secret -n kestrel-records records-approver-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null)
          BHV=; BAT=; OK2=1
          if [ "${{ inputs.equipment_with_bank }}" = true ]; then
            # the bank is installed on this cluster: its two values are looked for as well, and when they cannot be read nothing is uploaded
            BHV=$(kubectl get secret -n mcp-tools records-mcp-auth -o jsonpath='{.data.value}' 2>/dev/null | base64 -d 2>/dev/null)
            BAT=$(kubectl get secret -n fernvale-records records-approver-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d 2>/dev/null)
            { [ -n "$BHV" ] && [ -n "$BAT" ]; } || OK2=0
          fi
          if [ -n "$HV" ] && [ -n "$AT" ] && [ "$OK2" = 1 ]; then
            for f in kind-logs equipment-out install.log install2.log install-bank.log equipment-live.log install-events.log events-off.log events-on.log events-out; do
              [ -e "$f" ] || continue
              if grep -rlF -f <(printf '%s\n%s\n%s\n%s\n' "${HV#Bearer }" "$AT" "${BHV#Bearer }" "$BAT" | grep .) "$f" >/dev/null 2>&1; then
                echo "a secret value is in $f: it is removed from the upload"; rm -rf "$f"; LEAK=1
              fi
            done
          else
            echo "the secret values could not be read from the cluster: none of the equipment files is uploaded"; rm -rf kind-logs equipment-out install.log install2.log install-bank.log equipment-live.log install-events.log events-off.log events-on.log events-out; LEAK=1
          fi
          unset HV AT BHV BAT
          [ "$LEAK" = 0 ]
      - name: upload the report, the audit file and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equipment-live
          path: |
            equipment-out/report.json
            equipment-out/audit.jsonl
            equipment-out/eval.out
            equipment-live.log
            events-off.log
            events-on.log
            events-out/
            install.log
            install2.log
            install-bank.log
            install-events.log
            kind-logs
          retention-days: 14
          if-no-files-found: ignore

  # Opt-in (workflow_dispatch with the input `event_triggers`; EVENT_LIVE=1 for the script): event callers on a real cluster (ADR 0027, issue #229). The quick start plus
  # hack/ci/event-ci-values.yaml (two event callers and one plain caller), the stub model, no key, no token. hack/ci/event-live.sh puts a recording stand-in between the
  # A2A gate and the runtime (a second container of the gate pod), then starts runs as an event caller and checks what the stand-in received, the refusals, the rate
  # limit, the audit lines and the logs. It also runs the check of the runtime's message id scope. The run is scripted by the stub model: it proves the wiring.
  e2e-event-triggers:
    name: e2e (event triggers, ADR 0027)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.event_triggers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart plus the event values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/event-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: message id scope of the runtime
        run: |
          set -o pipefail
          hack/ci/msgid-scope.sh 2>&1 | tee msgid-scope.log
      - name: live check of event callers
        env:
          EVENT_LIVE: "1"
          EVENT_OUT: event-out
        run: |
          set -o pipefail
          hack/ci/event-live.sh 2>&1 | tee event-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Event callers on a real cluster (ADR 0027, issue #229)"
            echo "The stub model answers: the run is SCRIPTED. The recording stand-in sits between the gate and the controller."
            echo '```'
            cat msgid-scope.log 2>/dev/null || echo "the message id scope check did not run"
            echo '```'
            echo '```'
            cat event-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          echo "--- the gate (audit lines hold no message text) and the stand-in"
          kubectl logs -n openagentix-gateway -l app=a2a-gate -c a2a-gate --tail=300 | cut -c1-400 || true
          kubectl logs -n openagentix-gateway -l app=a2a-gate -c recorder --tail=20 || true
          kubectl logs -n kagent deploy/kagent-controller --tail=100 | cut -c1-400 || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-triggers
          path: |
            event-out/report.json
            event-live.log
            msgid-scope.log
            install.log
            kind-logs
          if-no-files-found: ignore
          retention-days: 14

  # Opt-in (workflow_dispatch with the input `adr_spikes`): two design spikes on the quick start, the stub model only (issue #229). Spike A reads what the
  # model gateway does with a per-key class in a conditional rate limit (ADR 0029, PR #262). Spike B reads what the runtime behind the A2A gate does with a
  # non-blocking send, a client that leaves, a repeated messageId and unusual message keys, and measures the gate's memory (ADR 0027, PR #260).
  # It changes the throwaway cluster it runs on and refuses to run anywhere else. Notes: docs/decisions/spikes/.
  e2e-adr-spikes:
    name: e2e (adr spikes ${{ inputs.adr_spikes }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.adr_spikes != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart, no key, no token)
        env:
          PROFILE: quickstart
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: spikes
        env:
          SPIKES: ${{ inputs.adr_spikes }}
          SPIKE_OUT: ${{ github.workspace }}/spike-out
        run: |
          set -o pipefail
          hack/spikes/adr-spikes.sh 2>&1 | tee spike.log
      - name: diagnostics
        if: always()
        run: |
          mkdir -p spike-out
          kubectl get pods -A -o wide > spike-out/pods.txt 2>&1 || true
          kubectl get agentgatewaypolicy -n agentgateway-system -o yaml > spike-out/gateway-policy.yaml 2>&1 || true
          tail -150 spike.log > spike-out/spike-tail.txt 2>&1 || true
      - name: upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adr-spikes
          path: |
            spike-out/
            spike.log
            install.log
          if-no-files-found: ignore
          retention-days: 30

  # Opt-in (workflow_dispatch with the input `budget_classes`; BUDGET_CLASSES_LIVE=1 for the script): budget classes on a real cluster (ADR 0029, slice 3, issue #229).
  # The quick start is installed with hack/ci/budget-classes-ci-values.yaml: two classes (tight, wide), the default budget made small, and three chart agents (one in
  # each class and one with none). install.sh writes the class into each key entry. hack/ci/budget-classes-live.sh then shows, through the policy the CHART rendered
  # and the stub model behind a recording stand-in (no paid call): a key of class tight is refused with 429 after its limit while a key of class wide passes, a key with
  # no class gets the default, a refused call never reaches the model, and how many parallel calls pass a bucket that has room for one more call.
  e2e-budget-classes:
    name: e2e (budget classes)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.budget_classes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart plus the budget class values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/budget-classes-ci-values.yaml
          CLUSTER: oa-budget-ci   # never the default name: the live script refuses kind-openagentix
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: live proof of budget classes
        env:
          BUDGET_CLASSES_LIVE: "1"
          BUDGET_CLASSES_CI_CONTEXT: kind-oa-budget-ci
        run: |
          set -o pipefail
          hack/ci/budget-classes-live.sh 2>&1 | tee budget-classes-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## Budget classes on a real cluster (ADR 0029, slice 3)"
            echo '```'
            cat budget-classes-live.log 2>/dev/null || echo "the live proof did not run"
            echo '```'
            echo "### install.sh, key lines"
            echo '```'
            grep -E "virtual key for agent|ConfigMap .*llm-api-keys" install.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          kubectl get agentgatewaypolicy -n agentgateway-system -o yaml | head -120 || true
          echo "--- the key entries, without the hashes"
          kubectl get configmap llm-api-keys -n agentgateway-system -o json | jq -c '.data|with_entries(.value|=(fromjson|.metadata))' || true
          kubectl logs -n agentgateway-system -l gateway.networking.k8s.io/gateway-name=model-gateway --tail=200 --all-containers | cut -c1-400 || true
          kind export logs ./kind-logs --name oa-budget-ci || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-budget-classes
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `adr0031`): the spike of ADR 0031 (issue #229). The cluster of the endpoints job (two tiny endpoints with header
  # Secrets, the quick start, the stub model), then hack/spikes/adr0031_tool_server_spike.py writes ServiceAccounts and Roles by hand, sets spec.serviceAccount on
  # the tool servers and records what ToolHive 0.67.1 does. It changes the throwaway cluster only and refuses to run anywhere else. Notes: docs/diary/features/.
  e2e-adr0031-spike:
    name: e2e (adr 0031 spike, tool server accounts)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.adr0031 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: cluster, then the endpoints (their namespace and workload come before the platform values)
        env:
          ENDPOINTS: "1"
        run: |
          set -o pipefail
          kind create cluster --name openagentix --config hack/kind-config.yaml
          hack/ci/endpoints-ci-setup.sh 2>&1 | tee setup.log
      - name: install (PROFILE=quickstart plus the endpoints values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/endpoints-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: spike
        env:
          SPIKE_OUT: ${{ github.workspace }}/spike-out
        run: |
          set -o pipefail
          timeout 3000 python3 -I hack/spikes/adr0031_tool_server_spike.py 2>&1 | tee spike.log
      - name: job summary
        if: always()
        run: |
          [ -f spike-out/results-adr0031.md ] && cat spike-out/results-adr0031.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: diagnostics
        if: always()
        run: |
          mkdir -p spike-out
          kubectl get pods -A -o wide > spike-out/pods.txt 2>&1 || true
          kubectl get virtualmcpserver -n mcp-tools -o yaml > spike-out/vmcp.yaml 2>&1 || true
          kubectl logs -n toolhive-system deploy/toolhive-operator --tail=3000 > spike-out/log-operator.txt 2>&1 || true
          for d in tools tools-disputes tools-lookup tools-lookup-cm tools-disputes-workload probe-own; do kubectl logs -n mcp-tools "deploy/$d" --all-containers --tail=1500 > "spike-out/log-$d.txt" 2>&1 || true; done
      - name: upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adr0031-spike
          path: |
            spike-out/
            spike.log
            install.log
          if-no-files-found: ignore
          retention-days: 30
