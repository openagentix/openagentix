name: e2e

# Keyless end-to-end install (ADR 0014, issue #34): a kind cluster on a hosted runner, `PROFILE=quickstart ./install.sh` with NO key and NO
# chat token (the built-in stub model), then hack/ci/smoke.sh. It writes the time to the first working agent to the job summary.
# NOT part of the required `ci-ok` gate until it has passed reliably; see hack/ci/README.md for its record and for what it proves.
on:
  pull_request:
    paths:
      - install.sh
      - uninstall.sh
      - charts/**
      - components/**
      - services/**
      - console/**
      - hack/ci/smoke.sh
      - hack/ci/diagnostics-live.sh
      - hack/ci/diagnostics-ci-values.yaml
      - hack/ci/endpoints-live.sh
      - hack/ci/endpoints-ci-setup.sh
      - hack/ci/endpoints-ci-values.yaml
      - hack/ci/endpoints-ci/**
      - hack/ci/phases.sh
      - hack/demo.sh
      - hack/ask.sh
      - hack/kind-config.yaml
      - .github/workflows/e2e.yml
  schedule:
    - cron: '17 3 * * *'   # nightly
  workflow_dispatch:
    inputs:
      diagnostics:
        description: 'Run the live check of cluster-read (ADR 0025, slice 4) instead of the profiles: the quick start plus hack/ci/diagnostics-ci-values.yaml'
        type: boolean
        default: false
      endpoints:
        description: 'Run the live check of mcp.endpoints (ADR 0026, slice 2) instead of the profiles: two tiny endpoints, then the quick start plus hack/ci/endpoints-ci-values.yaml'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.profile }})
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.diagnostics && !inputs.endpoints) }}
    runs-on: ubuntu-24.04          # 4 vCPU / 16 GB for public repositories
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: quickstart    # the quick start, with the sample container agent: the same set as the runs before issue #29
            byo: "1"
            console: "1"
          - profile: minimal       # issue #29: no console, no observability, no sample container agent
            byo: "0"
            console: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: runner resources before the install
        run: |
          nproc; free -m | head -2; df -h / | tail -1
          ls -l /dev/kvm 2>&1 || true
          uname -r
      - name: install (PROFILE=${{ matrix.profile }}, no key, no token)
        id: install
        env:
          PROFILE: ${{ matrix.profile }}
          QUICKSTART_BYO: ${{ matrix.byo }}   # 1: also the sample container agent (bring your own agent, ADR 0015)
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          start=$(date +%s)
          ./install.sh 2>&1 | tee install.log
          echo "install_start=$start" >> "$GITHUB_OUTPUT"
          echo "install_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: smoke test
        id: smoke
        env:
          SMOKE_BYO: ${{ matrix.byo }}
          SMOKE_CONSOLE: ${{ matrix.console }}   # 0: the profile has no console, so the console check is skipped
        run: |
          set -o pipefail
          start=$(date +%s)
          hack/ci/smoke.sh 2>&1 | tee smoke.log
          echo "smoke_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: demo walkthrough (hack/demo.sh)
        id: demo
        env:
          DEMO_CONSOLE: ${{ matrix.console }}   # 0: the profile has no console, so the console step is skipped
        run: |
          set -o pipefail
          hack/demo.sh 2>&1 | tee demo.log
      - name: node-settings manifest validates (dry run only, not applied; issue #163)
        run: kubectl apply --dry-run=client --validate=strict -f components/runtime/node-settings.yaml
      - name: runner resources after the install
        if: always()
        run: |
          free -m | head -2
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' || true
          uptime
      - name: phases (time to first working agent, issue #35)
        if: always()
        env:
          INSTALL_START: ${{ steps.install.outputs.install_start }}
        run: |
          if [ -n "${INSTALL_START:-}" ] && [ -f install.log ]; then
            hack/ci/phases.sh --install-log install.log --smoke-log smoke.log --install-start "$INSTALL_START" --json phases.json --title "Time to first working agent (phases), PROFILE=${{ matrix.profile }}" > phases.md || true
            cat phases.md phases.json 2>/dev/null || true
          fi
      - name: job summary (time to first working agent)
        if: always()
        env:
          INSTALL_S: ${{ steps.install.outputs.install_seconds }}
          SMOKE_S: ${{ steps.smoke.outputs.smoke_seconds }}
          INSTALL_START: ${{ steps.install.outputs.install_start }}
        run: |
          {
            if [ -f phases.md ]; then cat phases.md; echo '```json'; cat phases.json; echo '```'; echo; fi
            echo "## PROFILE=${{ matrix.profile }}, keyless (stub model)"
            echo
            echo "- time from \`./install.sh\` start to the agent Ready and the summary: **${INSTALL_S:-n/a} s** (cold runner: nothing cached)"
            echo "- smoke test (question through the gate, refused tool, refused definition, console API): ${SMOKE_S:-n/a} s"
            echo "- runner: $(nproc) vCPU, $(free -m | awk '/Mem:/{print $2}') MB"
            echo
            echo "### Where the time goes (install.sh steps)"
            echo '```'
            grep '^=== ' install.log 2>/dev/null || true
            echo '```'
            echo "### Smoke test"
            echo '```'
            cat smoke.log 2>/dev/null || true
            echo '```'
            echo "### Demo walkthrough (hack/demo.sh)"
            echo '```'
            cat demo.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl get agent,agentdefinition -A -o yaml | head -150 || true
          kubectl get remotemcpserver -A || true
          kubectl logs -n kagent deploy/kagent-controller --tail=80 || true
          kubectl logs -n openagentix-system deploy/openagentix-control-plane --tail=60 || true
          kubectl get resourcequota -A -o yaml | head -60 || true
          kubectl logs -n kube-system -l component=kube-controller-manager --tail=400 | grep -i quota | tail -20 || true
          echo "--- what the admission guard says about a key Secret"
          hack/ci/guard-probe.sh
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `diagnostics`; DIAGNOSTICS=1 for the script): cluster-read on a real API server. It settles whether the server
  # becomes Ready (its rights check passes with the default discovery rules of a real ServiceAccount, the open question R2 of the code review of ADR 0025
  # slice 3) and what ToolHive loaded for the dedicated profile (the eight tools) and for the shared vMCP (none). See hack/ci/diagnostics-ci-values.yaml.
  e2e-diagnostics:
    name: e2e (diagnostics, cluster-read)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: install (PROFILE=quickstart plus the diagnostics values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/diagnostics-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: live check of cluster-read
        env:
          DIAGNOSTICS: "1"
        run: |
          set -o pipefail
          hack/ci/diagnostics-live.sh 2>&1 | tee diagnostics-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## cluster-read on a real API server (ADR 0025, slice 4)"
            echo '```'
            cat diagnostics-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### install.sh, diagnostics lines"
            echo '```'
            grep -iE 'diagnostics|cluster-read|DiscoveredAuthConfig' install.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- cluster-read (its log holds no secret)"
          kubectl describe pod -n openagentix-diagnostics -l app=cluster-read | tail -60 || true
          kubectl logs -n openagentix-diagnostics deploy/cluster-read --tail=80 || true
          echo "--- the vMCPs and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}]}' || true
          kubectl get remotemcpserver -n kagent -o json | jq -c '.items[]|{name:.metadata.name,tools:[.status.discoveredTools[]?.name]}' || true
          kubectl get validatingadmissionpolicy openagentix-diagnostics-rbac -o json | jq -c '.status' || true
          echo "--- R2: every right the ServiceAccount has, and who grants the ones the rights check calls forbidden"
          kubectl auth can-i --list --as=system:serviceaccount:openagentix-diagnostics:cluster-read -n diag-ci || true
          kubectl auth can-i --list --as=system:serviceaccount:openagentix-diagnostics:cluster-read || true
          kubectl get clusterrole -o json | jq -r '.items[]|select([.rules[]?|(.resources//[])[]]|index("clustertrustbundles"))|"ClusterRole "+.metadata.name' || true
          kubectl get clusterrolebinding -o json | jq -c '.items[]|select(.roleRef.name as $r|["system:cluster-trust-bundles-reader"]|index($r))|{name:.metadata.name,role:.roleRef.name,subjects:.subjects}' || true
          kubectl get clusterrolebinding -o json | jq -c '.items[]|select(any(.subjects[]?;.kind=="Group" and (.name=="system:authenticated" or .name=="system:serviceaccounts")))|{name:.metadata.name,role:.roleRef.name}' || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-diagnostics
          path: kind-logs
          retention-days: 7

  # Opt-in (workflow_dispatch with the input `endpoints`; ENDPOINTS=1 for the scripts): mcp.endpoints on a real cluster (ADR 0026, slice 2). Two tiny MCP endpoints
  # (hack/ci/endpoints-ci/echo-mcp.py) run in their own namespace BEFORE the platform install, as the ADR says; each takes a header value from a Secret. The job
  # settles that a profile vMCP on the group of the endpoints lists exactly its tools through a real tools/list, that the shared vMCP lists none and refuses a call,
  # that the endpoint refuses a wrong header, that no log has the value, that a profile offers tools only (no resource or prompt of a backend it does not list),
  # and records what the vMCP does with `overrides` and with a redirect. See hack/ci/endpoints-ci-values.yaml.
  e2e-endpoints:
    name: e2e (endpoints, mcp.endpoints)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.endpoints }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.0
      - run: hack/ci/install-tools.sh yq kind
      - name: cluster, then the endpoints (their namespace and workload come before the platform values)
        env:
          ENDPOINTS: "1"
        run: |
          set -o pipefail
          kind create cluster --name openagentix --config hack/kind-config.yaml
          hack/ci/endpoints-ci-setup.sh 2>&1 | tee setup.log
      - name: install (PROFILE=quickstart plus the endpoints values, no key, no token)
        env:
          PROFILE: quickstart
          VALUES_FILE: hack/ci/endpoints-ci-values.yaml
          AGENT_WAIT: 300s
        run: |
          set -o pipefail
          ./install.sh 2>&1 | tee install.log
      - name: live check of mcp.endpoints
        env:
          ENDPOINTS: "1"
        run: |
          set -o pipefail
          hack/ci/endpoints-live.sh 2>&1 | tee endpoints-live.log
      - name: job summary
        if: always()
        run: |
          {
            echo "## mcp.endpoints on a real cluster (ADR 0026, slice 2)"
            echo '```'
            cat endpoints-live.log 2>/dev/null || echo "the live check did not run"
            echo '```'
            echo "### install.sh, endpoint lines"
            echo '```'
            grep -iE 'endpoint|DiscoveredAuthConfig|apiserver|API server' install.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostics
        if: always()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          echo "--- the endpoints and their pods (their log holds no secret)"
          kubectl get pods,svc,networkpolicy -n endpoint-ci || true
          kubectl logs -n endpoint-ci deploy/echo --tail=60 || true
          echo "--- the vMCPs, the groups, the entries and their conditions"
          kubectl get virtualmcpserver,mcpserverentry,mcpgroup -n mcp-tools || true
          kubectl get virtualmcpserver -n mcp-tools -o json | jq -c '.items[]|{name:.metadata.name,conditions:[.status.conditions[]?|{type,status,reason}],backends:[.status.discoveredBackends[]?|{name,status}]}' || true
          kubectl get networkpolicy -n mcp-tools -o json | jq -c '.items[]|select(.metadata.name|test("egress"))|{name:.metadata.name,egress:(.spec.egress|length)}' || true
          kind export logs ./kind-logs --name openagentix || true
      - name: upload cluster logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-endpoints
          path: kind-logs
          retention-days: 7
