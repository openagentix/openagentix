name: ci

# Pull requests and pushes to main. Same checks as `make test`, `make lint`, `make test-integration`, `make secrets`
# (see hack/ci/README.md). Docs-only changes skip the heavy jobs (the `changes` job). One required status check: `ci-ok`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  HELM_VERSION: v3.22.0   # the version the chart tests were written against

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      go_matrix: ${{ steps.matrix.outputs.go_matrix }}
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: hack/ci/changes.sh "$BASE" "$HEAD"
      - id: matrix
        run: |
          echo "go_matrix=$(hack/ci/go-modules.sh --json)" >> "$GITHUB_OUTPUT"
          echo "image_matrix=$(hack/ci/dockerfiles.sh --json)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------------------------
  go:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15            # about 1-3 minutes per module
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.go_matrix) }}
    name: go (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.sum }}
      # a few tests shell out to yq (the Python wrapper) and would otherwise skip
      - run: hack/ci/install-tools.sh yq
      - name: gofmt
        working-directory: ${{ matrix.dir }}
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: ${{ matrix.dir }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.dir }}
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: coverage summary
        working-directory: ${{ matrix.dir }}
        run: |
          { echo "### coverage: ${{ matrix.dir }}"; echo '```'; go tool cover -func=coverage.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.dir }}/coverage.out
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------
  chart:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15            # about 1-2 minutes of tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: jq and yq (the Python jq wrapper, not mikefarah's)
        run: |
          jq --version
          hack/ci/install-tools.sh yq
          yq --version
      - run: helm lint charts/openagentix
      - run: charts/openagentix/tests/run.sh

  # ---------------------------------------------------------------------------------------------------------------
  shell:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15            # about 2 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # jsdom lives in website/node_modules; without it the dashboard page test is skipped
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: hack/ci/install-tools.sh yq shellcheck
      - name: channels tests
        run: components/channels/tests/run.sh
      - name: dashboard tests
        run: hack/dashboard/tests/run.sh
      - name: DCO check, image tag and quick start tests
        run: |
          hack/ci/dco-test.sh
          hack/ci/image-tag-test.sh
          hack/ci/kind-image-digest-test.sh
          components/quickstart/tests/run.sh
      - name: reference docs tests
        run: |
          pip install --quiet pyyaml==6.0.2 jsonschema==4.26.0
          hack/docs/tests/run.sh
      - name: bench tests (python)
        run: |
          python3 -m unittest discover -s components/bench -p 'test_*.py'
          python3 -m unittest discover -s components/bench/compare -p 'test_*.py'
      # Report only until the tree is clean (see hack/ci/README.md); flip SHELLCHECK_STRICT to make it blocking.
      - name: shellcheck (warning level, non-blocking)
        env:
          SHELLCHECK_STRICT: '0'
        run: |
          make lint-shell | tee shellcheck.txt
          { echo "### shellcheck"; echo '```'; tail -1 shellcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  integration:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20            # about 3-6 minutes, most of it pulling the pgvector and postgres images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/kb/go.mod
          cache: true
          cache-dependency-path: services/kb/go.sum
      - run: hack/ci/install-tools.sh yq
      - name: kb against PostgreSQL + pgvector (throwaway containers)
        run: make -C services/kb test-integration
      - name: memory-expiry job against pgvector (starts its own container)
        run: charts/openagentix/tests/memory-expiry-integration.sh

  # ---------------------------------------------------------------------------------------------------------------
  secrets:
    # Always runs, docs-only changes included. Scans the commits of the push or the pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: hack/ci/install-tools.sh gitleaks
      - name: gitleaks (honours .gitleaksignore)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ] && [ -n "${BASE//0/}" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            gitleaks git --no-banner --redact --verbose --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact --verbose .
          fi

  # ---------------------------------------------------------------------------------------------------------------
  images:
    # Proves every self-contained Dockerfile builds. Nothing is pushed or loaded. linux/amd64 only: the Dockerfiles do not
    # pin a platform, so arm64 would build under QEMU emulation (slow) and is not covered yet (see hack/ci/README.md).
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20            # about 1-3 minutes per image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    name: image (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}

  # ---------------------------------------------------------------------------------------------------------------
  guard:
    # The control plane's admission guard is EXECUTED, not string-matched: the policy objects `helm template` renders for the demo values are
    # evaluated with the Kubernetes admission CEL code (k8s.io/apiserver) over cases made from the kagent adapter's golden files. Own Go
    # module (hack/ci/guardtest) so the heavy dependency never touches a service module. Local: `make test-guard`.
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15            # about 2 minutes (most of it compiling k8s.io/apiserver on a cold cache)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: hack/ci/guardtest/go.mod
          cache: true
          cache-dependency-path: hack/ci/guardtest/go.sum
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - run: make test-guard

  # ---------------------------------------------------------------------------------------------------------------
  apiserver:
    # The AgentDefinition CRD and the admission guard against a real API server in a throwaway kind cluster (one control-plane node, no controller
    # image, no model): server-side validation of the rendered objects, status.typeChecking of the policies, the example definition, invalid
    # definitions, and impersonated writes as the controller's ServiceAccount. Local: `make test-apiserver`.
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20            # about 3-5 minutes (kind node image pull, then the cluster)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - run: hack/ci/install-tools.sh yq kind
      - run: make test-apiserver

  # ---------------------------------------------------------------------------------------------------------------
  # Console (Svelte app in console/, Go service in services/console, tested by the `go` and `images` jobs above). Local: `make test-console`,
  # `make test-console-e2e`.
  console:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15            # about 2-3 minutes
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json      # the pnpm version is pinned by "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  console-audit:
    # Known-vulnerability check of the console's npm dependencies. Runtime (production) dependencies block; the full tree,
    # which holds only build and test tools, is reported and does not.
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pnpm audit --prod (blocking)
        run: pnpm audit --prod
      - name: pnpm audit, the whole tree (report only)
        continue-on-error: true
        run: |
          pnpm audit 2>&1 | tee audit.txt
          { echo "### pnpm audit (all dependencies, not blocking)"; echo '```'; tail -3 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  console-e2e:
    # Playwright (Chromium) against the Go binary in demo mode serving the built web app: no cluster, no model.
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20            # about 4-6 minutes (Chromium download, web build, go build)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: services/console/go.mod
          cache: true
          cache-dependency-path: services/console/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: build the web app and copy it into the Go service (go:embed)
        run: services/console/build-web.sh
      - name: install Chromium with its system libraries
        working-directory: console
        run: pnpm exec playwright install --with-deps chromium
      - name: end-to-end tests
        working-directory: console
        run: pnpm test:e2e
      - name: upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-playwright-report
          path: |
            console/playwright-report
            console/test-results
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------------------
  ci-ok:
    # The one required status check. Skipped jobs (docs-only change) count as passing; failed or cancelled ones do not.
    if: always()
    needs: [changes, go, chart, shell, integration, secrets, images, guard, apiserver, console, console-audit, console-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: all needed jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
