# Cloud Build recipe for the four images the quick start builds from this repository (hack/gke/up.sh submits it).
# Cloud Build workers are linux/amd64, which is what c3-standard-4 nodes run. The four steps start at once
# (waitFor: ['-']). Images are pushed to ${_REPO} with the tag ${_TAG} after all steps succeed.
# Build contexts are the same as install.sh uses: the service directory, and the repository root for the console.
steps:
  - id: a2a-gate
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REPO}/a2a-gate:${_TAG}', 'services/a2a-gate']
  - id: stub-model
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REPO}/stub-model:${_TAG}', 'services/stub-model']
  - id: control-plane
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REPO}/control-plane:${_TAG}', 'services/control-plane']
  - id: console
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-t', '${_REPO}/console:${_TAG}', '-f', 'services/console/Dockerfile', '.']
images:
  - '${_REPO}/a2a-gate:${_TAG}'
  - '${_REPO}/stub-model:${_TAG}'
  - '${_REPO}/control-plane:${_TAG}'
  - '${_REPO}/console:${_TAG}'
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _REPO: ''
  _TAG: gke1
