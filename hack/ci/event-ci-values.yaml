# Values for the live check of event callers (ADR 0027, issue #229): hack/ci/event-live.sh. Used with PROFILE=quickstart (VALUES_FILE).
# Lists are replaced, not merged, so the quick start's own caller is listed again.
#   ev-live   an event caller with one text shape and roomy limits. The live script starts runs with it and sends its refused bodies.
#   ev-rate   an event caller with a tiny bucket (burst 2, one a minute): the live script drives it into 429.
#   ev-plain  a caller WITHOUT an event block, user id prefix plain:. It may not use an event caller's user id.
# The ServiceAccounts are made by the live script in the namespace event-ci; the callers are reached through a port-forward.
governance:
  a2a:
    callers:
      - name: quickstart-ask
        serviceAccount: {namespace: openagentix-system, name: quickstart-ask}
        agents: ["kagent/quickstart"]
        userId: {exact: "quickstart:ask"}
      - name: ev-live
        serviceAccount: {namespace: event-ci, name: ev-live}
        agents: ["kagent/quickstart"]
        event:
          text: 'Work case SVC-[0-9]{4}-[0-9]{4}'
          rate: {perMinute: 600, burst: 60}   # roomy: the live script sends about forty requests to it
          maxInFlight: 4
      - name: ev-rate
        serviceAccount: {namespace: event-ci, name: ev-rate}
        agents: ["kagent/quickstart"]
        event:
          text: 'Work case SVC-[0-9]{4}-[0-9]{4}'
          rate: {perMinute: 1, burst: 2}
          maxInFlight: 2
      - name: ev-plain
        serviceAccount: {namespace: event-ci, name: ev-plain}
        agents: ["kagent/quickstart"]
        userId: {prefix: "plain:"}
